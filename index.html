<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AbbaMend Promo Generator — Robot Animado + CTA WhatsApp</title>
  <style>
    body {
      margin: 0;
      background: #04070d;
      color: #f8fafc;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 16px;
    }
    .stage-wrapper {
      position: relative;
      height: 75vh;
      aspect-ratio: 9 / 16;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.8);
      border: 1px solid #1e293b;
      background: #070b14;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    /* Botón real clicable sincronizado con la escena final (21s - 25s) */
    #waCtaOverlay {
      position: absolute;
      left: 50%;
      top: 72%;
      transform: translate(-50%, -50%);
      width: 72%;
      padding: 16px 20px;
      border-radius: 999px;
      background: #10b981;
      color: #042316;
      font-weight: 900;
      font-size: clamp(14px, 2.2vh, 22px);
      text-align: center;
      text-decoration: none;
      box-shadow: 0 12px 30px rgba(16, 185, 129, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      z-index: 10;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    #waCtaOverlay:hover {
      background: #34d399;
      transform: translate(-50%, -52%) scale(1.02);
    }
    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      padding: 12px 22px;
      border-radius: 12px;
      border: none;
      font-weight: 800;
      cursor: pointer;
      font-size: 14px;
      transition: transform 0.15s ease;
    }
    button:active { transform: scale(0.97); }
    #btnPlay { background: #1e293b; color: #f8fafc; border: 1px solid #334155; }
    #btnRecord { background: #06b6d4; color: #04131a; }
    #status { font-size: 13px; color: #94a3b8; text-align: center; padding: 0 16px; }
  </style>
</head>
<body>

  <div class="stage-wrapper">
    <canvas id="stage" width="1080" height="1920"></canvas>
    <a id="waCtaOverlay" target="_blank" rel="noopener noreferrer">
      Solicitar Demo por WhatsApp →
    </a>
  </div>

  <div class="controls">
    <button id="btnPlay">▶ Vista Previa (25s)</button>
    <button id="btnRecord">⏺ Grabar y Descargar (.webm)</button>
  </div>
  <div id="status">Configura tu número de WhatsApp en el código para activar el enlace directo.</div>

  <script>
    // =========================================================================
    // CONFIGURA AQUÍ TU NÚMERO DE WHATSAPP (ej. Ecuador: '5939XXXXXXXX')
    // =========================================================================
    const WHATSAPP_PHONE = 'TU_NUMERO_WHATSAPP';
    const WHATSAPP_MESSAGE = 'Hola AbbaMend, vi la demo y quiero solicitar una demo para mi negocio.';
    const WHATSAPP_URL = `https://wa.me/${WHATSAPP_PHONE}?text=${encodeURIComponent(WHATSAPP_MESSAGE)}`;

    const waBtn = document.getElementById('waCtaOverlay');
    waBtn.href = WHATSAPP_URL;

    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');

    const DURATION = 25000;
    let startTime = null;
    let animId = null;

    // Cargar logo real de AbbaMend respetando proporciones
    const abbaLogo = new Image();
    abbaLogo.crossOrigin = 'anonymous';
    abbaLogo.src = './logoAbbaMend.png';
    let logoLoaded = false;
    abbaLogo.onload = () => {
      logoLoaded = true;
      statusEl.textContent = 'Logo logoAbbaMend.png cargado. Listo para previsualizar o grabar.';
      renderFrame(performance.now() - (startTime || performance.now()));
    };

    function roundRect(x, y, w, h, r, fill, stroke = null, lineWidth = 3) {
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, r);
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lineWidth; ctx.stroke(); }
    }

    function wrapLines(text, maxWidth, font) {
      ctx.font = font;
      const words = text.split(' ');
      const lines = [];
      let current = '';

      for (let i = 0; i < words.length; i++) {
        const word = words[i];
        const test = current ? `${current} ${word}` : word;
        if (ctx.measureText(test).width <= maxWidth) {
          current = test;
        } else {
          if (current) lines.push(current);
          if (ctx.measureText(word).width > maxWidth) {
            let chunk = '';
            for (const ch of word) {
              const tChunk = chunk + ch;
              if (ctx.measureText(tChunk).width <= maxWidth) {
                chunk = tChunk;
              } else {
                if (chunk) lines.push(chunk);
                chunk = ch;
              }
            }
            current = chunk;
          } else {
            current = word;
          }
        }
      }
      if (current) lines.push(current);
      return lines;
    }

    function drawTextBlock(text, x, y, maxWidth, lineHeight, font, color, align = 'left') {
      const lines = wrapLines(text, maxWidth, font);
      ctx.font = font;
      ctx.fillStyle = color;
      ctx.textAlign = align;
      lines.forEach((line, idx) => {
        ctx.fillText(line, x, y + idx * lineHeight);
      });
      return lines.length * lineHeight;
    }

    function drawRealLogoBox(cx, cy, maxW, maxH, pillBg = '#ffffff') {
      if (pillBg) {
        roundRect(cx - maxW / 2 - 10, cy - maxH / 2 - 10, maxW + 20, maxH + 20, 24, pillBg, '#38bdf844', 2);
      }

      if (!logoLoaded) {
        roundRect(cx - maxW / 2, cy - maxH / 2, maxW, maxH, 18, '#0f172a', '#22d3ee', 2);
        drawTextBlock('abbá MEND', cx, cy + 8, maxW - 16, 28, '800 22px system-ui', '#22d3ee', 'center');
        return;
      }

      const ratio = abbaLogo.naturalWidth / abbaLogo.naturalHeight || 1;
      let w = maxW;
      let h = w / ratio;
      if (h > maxH) {
        h = maxH;
        w = h * ratio;
      }
      ctx.drawImage(abbaLogo, cx - w / 2, cy - h / 2, w, h);
    }

    // Robot IA animado por código
    function drawAnimatedRobot(cx, cy, sec, scale = 1) {
      const floatY = Math.sin(sec * 4.2) * 14;
      const tilt = Math.sin(sec * 2.5) * 0.05;
      const armWave = Math.sin(sec * 6.5) * 0.35;
      const blinkCycle = sec % 3.2;
      const isBlinking = blinkCycle > 3.05;
      const eyeLookX = Math.sin(sec * 2.2) * 7;

      ctx.save();
      ctx.translate(cx, cy + floatY);
      ctx.rotate(tilt);
      ctx.scale(scale, scale);

      // Sombra / aura inferior
      const aura = ctx.createRadialGradient(0, 115, 8, 0, 115, 95);
      aura.addColorStop(0, 'rgba(34, 211, 238, 0.38)');
      aura.addColorStop(1, 'rgba(34, 211, 238, 0)');
      ctx.fillStyle = aura;
      ctx.beginPath();
      ctx.ellipse(0, 115, 95, 24, 0, 0, Math.PI * 2);
      ctx.fill();

      // Antena
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 7;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(0, -56);
      ctx.lineTo(0, -96);
      ctx.stroke();

      const tipPulse = 9 + Math.sin(sec * 9) * 2.5;
      ctx.fillStyle = '#f59e0b';
      ctx.beginPath();
      ctx.arc(0, -102, tipPulse, 0, Math.PI * 2);
      ctx.fill();

      // Brazo izquierdo
      ctx.save();
      ctx.translate(-68, 22);
      ctx.rotate(-0.4 + armWave);
      roundRect(-14, 0, 24, 62, 12, '#0284c7', '#38bdf8', 2);
      ctx.restore();

      // Brazo derecho saludando / señalando
      ctx.save();
      ctx.translate(68, 22);
      ctx.rotate(0.5 - armWave);
      roundRect(-10, 0, 24, 62, 12, '#0284c7', '#38bdf8', 2);
      ctx.restore();

      // Torso compacto
      roundRect(-48, 12, 96, 76, 24, '#0f172a', '#22d3ee', 3);
      // Indicador luminoso en pecho
      ctx.fillStyle = '#10b981';
      ctx.beginPath();
      ctx.arc(0, 50, 11, 0, Math.PI * 2);
      ctx.fill();

      // Cabeza del robot
      const headGrad = ctx.createLinearGradient(-75, -58, 75, 16);
      headGrad.addColorStop(0, '#0ea5e9');
      headGrad.addColorStop(1, '#0284c7');
      roundRect(-76, -58, 152, 76, 34, headGrad, '#bae6fd', 3);

      // Visor oscuro
      roundRect(-58, -42, 116, 44, 20, '#060a13', '#0f172a', 2);

      // Ojos animados
      if (isBlinking) {
        ctx.strokeStyle = '#22d3ee';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(-36 + eyeLookX, -20);
        ctx.lineTo(-14 + eyeLookX, -20);
        ctx.moveTo(14 + eyeLookX, -20);
        ctx.lineTo(36 + eyeLookX, -20);
        ctx.stroke();
      } else {
        ctx.fillStyle = '#22d3ee';
        ctx.beginPath();
        ctx.arc(-25 + eyeLookX, -20, 10, 0, Math.PI * 2);
        ctx.arc(25 + eyeLookX, -20, 10, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-22 + eyeLookX, -23, 3.5, 0, Math.PI * 2);
        ctx.arc(28 + eyeLookX, -23, 3.5, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    function drawTopBar(sec) {
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, 0, 1080, 10);
      const progGrad = ctx.createLinearGradient(0, 0, 1080, 0);
      progGrad.addColorStop(0, '#06b6d4');
      progGrad.addColorStop(1, '#f59e0b');
      ctx.fillStyle = progGrad;
      ctx.fillRect(0, 0, (Math.min(sec * 1000, DURATION) / DURATION) * 1080, 10);

      roundRect(48, 30, 984, 114, 57, '#0f172a', '#1e293b', 2);
      drawRealLogoBox(108, 87, 74, 74, '#ffffff');

      drawTextBlock('AbbaMend', 162, 80, 520, 34, '800 30px system-ui', '#f8fafc', 'left');
      drawTextBlock('Apps • Fidelización • Automatización IA', 162, 112, 520, 26, '500 21px system-ui', '#38bdf8', 'left');

      roundRect(735, 54, 265, 66, 33, '#06b6d4');
      drawTextBlock('Demo en Vivo', 867, 95, 235, 30, '800 24px system-ui', '#04131a', 'center');
    }

    function renderFrame(elapsed) {
      const t = Math.min(elapsed, DURATION);
      const sec = t / 1000;

      // Mostrar botón real de WhatsApp solo en la escena de cierre (21s a 25s)
      waBtn.style.display = sec >= 21 ? 'flex' : 'none';

      const bg = ctx.createLinearGradient(0, 0, 0, 1920);
      bg.addColorStop(0, '#060a13');
      bg.addColorStop(0.55, '#0b1222');
      bg.addColorStop(1, '#070b14');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, 1080, 1920);

      drawTopBar(sec);

      // ESCENA 1 (0s - 4s)
      if (sec < 4) {
        roundRect(64, 180, 952, 1110, 44, '#0f172a', '#1e293b', 2);

        roundRect(104, 224, 670, 56, 28, '#06b6d41c', '#06b6d466', 2);
        drawTextBlock('KINETIX • SNEAKERS, STREETWEAR & DROPS', 439, 260, 630, 28, '800 21px system-ui', '#22d3ee', 'center');

        drawTextBlock('Cada paso marca tu propio estilo.', 104, 385, 870, 88, '900 76px system-ui', '#ffffff', 'left');
        drawTextBlock(
          'Catálogo interactivo, club de clientes frecuentes y pedido directo por WhatsApp sin perder ventas.',
          104, 600, 870, 46, '500 33px system-ui', '#cbd5e1', 'left'
        );

        const cardGrad = ctx.createLinearGradient(104, 755, 976, 1105);
        cardGrad.addColorStop(0, '#0284c7');
        cardGrad.addColorStop(1, '#06b6d4');
        roundRect(104, 755, 872, 350, 34, cardGrad);
        drawTextBlock('KINETIX', 540, 905, 800, 92, '900 88px system-ui', '#ffffff', 'center');
        drawTextBlock('URBAN FOOTWEAR & DROPS • DEMO INTERACTIVA', 540, 975, 800, 36, '800 25px system-ui', '#e0f2fe', 'center');
        drawTextBlock('Catálogo ágil • Puntos por visita • Reserva en WhatsApp', 540, 1030, 800, 34, '600 25px system-ui', '#f0f9ff', 'center');

        roundRect(104, 1150, 370, 82, 22, '#f59e0b');
        drawTextBlock('Ver catálogo  >', 289, 1200, 330, 32, '800 27px system-ui', '#1e1300', 'center');

        roundRect(498, 1150, 478, 82, 22, '#1e293b', '#334155', 2);
        drawTextBlock('Tienda & Drops • Respuesta rápida', 737, 1200, 440, 32, '600 24px system-ui', '#e2e8f0', 'center');

        drawTextBlock(
          'Tu negocio vende mejor con una app así; fideliza tus clientes',
          540, 1420, 920, 68, '800 54px system-ui', '#ffffff', 'center'
        );
        drawTextBlock(
          'Menú o catálogo digital + recompensas en un mismo flujo',
          540, 1615, 900, 44, '600 33px system-ui', '#fbbf24', 'center'
        );
      }

      // ESCENA 2 (4s - 10.5s)
      else if (sec < 10.5) {
        const localT = sec - 4;
        drawTextBlock('CATÁLOGO / MENÚ INTERACTIVO • KINETIX', 64, 205, 952, 32, '800 25px system-ui', '#22d3ee', 'left');
        drawTextBlock('Eligen, suman y piden directo a tu WhatsApp.', 64, 272, 952, 66, '900 54px system-ui', '#ffffff', 'left');

        const products = [
          { tag: 'DROP 01', name: 'Runner Retro 98 Cream', sub: 'Tallas 38–43 • Stock listo', price: '$68.00', at: 0.7 },
          { tag: 'EDICIÓN', name: 'Court Low Obsidian', sub: 'Estilo urbano • Alta rotación', price: '$59.00', at: 2.0 },
          { tag: 'ACCESORIO', name: 'Pack 3 Medias Pro Crew', sub: 'Ideal para elevar ticket', price: '$14.00', at: 3.3 }
        ];

        let total = 0;
        let itemsCount = 0;

        products.forEach((p, idx) => {
          const y = 395 + idx * 305;
          const active = localT >= p.at;
          if (active) {
            total += parseFloat(p.price.replace('$', ''));
            itemsCount++;
          }

          roundRect(64, y, 952, 272, 34, active ? '#0c2438' : '#0f172a', active ? '#22d3ee' : '#1e293b', active ? 3.5 : 2);

          drawTextBlock(p.tag, 102, y + 52, 600, 28, '800 22px system-ui', '#fbbf24', 'left');
          drawTextBlock(p.name, 102, y + 102, 610, 42, '800 36px system-ui', '#ffffff', 'left');
          drawTextBlock(p.sub, 102, y + 146, 610, 32, '500 25px system-ui', '#94a3b8', 'left');
          drawTextBlock(p.price, 102, y + 226, 560, 40, '900 36px system-ui', '#34d399', 'left');

          roundRect(732, y + 174, 244, 68, 20, active ? '#10b981' : '#1e293b', active ? '#10b981' : '#334155', 2);
          drawTextBlock(active ? '✓ Agregado' : '+ Elegir', 854, y + 217, 220, 30, '800 25px system-ui', active ? '#042316' : '#f8fafc', 'center');
        });

        const ready = localT >= 4.3;
        roundRect(64, 1345, 952, 165, 36, ready ? '#10b981' : '#0f172a', ready ? '#34d399' : '#334155', 3);
        drawTextBlock(
          `Reserva rápida por WhatsApp (${itemsCount} ítems)`,
          102, 1412, 880, 38, '800 31px system-ui', ready ? '#042316' : '#ffffff', 'left'
        );
        drawTextBlock(
          `Pedido armado en vivo • Total: $${total.toFixed(2)}`,
          102, 1464, 880, 34, '700 26px system-ui', ready ? '#064e3b' : '#94a3b8', 'left'
        );

        drawTextBlock(
          'Tu negocio vende mejor con una app así; fideliza tus clientes',
          540, 1595, 920, 46, '800 34px system-ui', '#fbbf24', 'center'
        );
      }

      // ESCENA 3 (10.5s - 16.5s)
      else if (sec < 16.5) {
        const localT = sec - 10.5;
        const visits = Math.min(5, Math.floor(localT * 1.2) + 1);

        const vipGrad = ctx.createLinearGradient(64, 195, 1016, 755);
        vipGrad.addColorStop(0, '#0f172a');
        vipGrad.addColorStop(1, '#13263f');
        roundRect(64, 195, 952, 560, 42, vipGrad, '#06b6d4', 3);

        drawTextBlock('BENEFICIOS PARA TI', 104, 262, 540, 30, '800 23px system-ui', '#22d3ee', 'left');

        roundRect(665, 226, 310, 62, 31, '#f59e0b');
        drawTextBlock(
          visits === 5 ? 'NIVEL VIP • PREMIO' : `CLIENTE • ${visits}/5 VISITAS`,
          820, 266, 280, 28, '900 21px system-ui', '#1e1300', 'center'
        );

        drawTextBlock('Club de Clientes Frecuentes', 104, 342, 870, 56, '900 46px system-ui', '#ffffff', 'left');
        drawTextBlock('• KINETIX', 104, 444, 870, 40, '800 32px system-ui', '#fbbf24', 'left');

        for (let i = 0; i < 5; i++) {
          const cx = 176 + i * 182;
          const cy = 602;
          const earned = i < visits;

          ctx.beginPath();
          ctx.arc(cx, cy, 60, 0, Math.PI * 2);
          ctx.fillStyle = earned ? '#f59e0b' : '#090e1a';
          ctx.fill();
          ctx.lineWidth = 3;
          ctx.strokeStyle = earned ? '#fde68a' : '#334155';
          ctx.stroke();

          drawTextBlock(earned ? '★' : `#${i + 1}`, cx, cy + 16, 90, 40, '900 38px system-ui', earned ? '#1e1300' : '#94a3b8', 'center');
        }

        roundRect(64, 795, 952, 470, 42, '#0f172a', '#1e293b', 2);
        drawTextBlock('FIDELIZACIÓN DIGITAL ACTIVA', 104, 862, 870, 32, '800 24px system-ui', '#fbbf24', 'left');
        drawTextBlock(
          visits === 5 ? '¡Beneficio VIP desbloqueado! 15% OFF en tu próximo pedido' : 'Suma visitas y desbloquea beneficios exclusivos.',
          104, 926, 870, 56, '900 44px system-ui', '#ffffff', 'left'
        );
        drawTextBlock(
          'Historial de visitas, puntos o sellos sin tarjetas de papel y listo para aumentar la recurrencia.',
          104, 1065, 870, 40, '500 29px system-ui', '#cbd5e1', 'left'
        );

        roundRect(104, 1164, 420, 64, 20, '#10b98122', '#10b98166', 2);
        drawTextBlock('✓ Sin tarjetas físicas', 314, 1204, 380, 30, '700 24px system-ui', '#34d399', 'center');

        roundRect(556, 1164, 420, 64, 20, '#f59e0b22', '#f59e0b66', 2);
        drawTextBlock('✓ Clientes que vuelven', 766, 1204, 380, 30, '700 24px system-ui', '#fbbf24', 'center');

        drawTextBlock(
          'Tu negocio vende mejor con una app así; fideliza tus clientes',
          540, 1410, 920, 64, '800 50px system-ui', '#ffffff', 'center'
        );
      }

      // ESCENA 4 (16.5s - 21s): Ecosistema + Robot Animado
      else if (sec < 21) {
        drawTextBlock('ECOSISTEMA COMPLETO • ABBAMEND', 64, 205, 720, 32, '800 25px system-ui', '#22d3ee', 'left');
        drawTextBlock('Automatización y software a medida.', 64, 272, 730, 62, '900 50px system-ui', '#ffffff', 'left');

        // Robot moviéndose en la esquina superior derecha
        drawAnimatedRobot(885, 295, sec, 1.05);

        const capabilities = [
          { num: '01', accent: '#22d3ee', title: 'Automatización & Flujos IA', desc: 'Atención automatizada, captura de leads y procesos conectados 24/7.' },
          { num: '02', accent: '#f59e0b', title: 'Web Apps & Micro-SaaS', desc: 'Catálogos, menús digitales, clubes de clientes y paneles en la nube.' },
          { num: '03', accent: '#10b981', title: 'Sistemas a Medida', desc: 'Arquitecturas y bases de datos adaptadas a la operación de tu empresa.' }
        ];

        capabilities.forEach((cap, idx) => {
          const y = 445 + idx * 315;
          roundRect(64, y, 952, 274, 34, '#0f172a', '#1e293b', 2);

          roundRect(102, y + 46, 86, 86, 24, cap.accent);
          drawTextBlock(cap.num, 145, y + 102, 80, 40, '900 34px system-ui', '#04131a', 'center');

          drawTextBlock(cap.title, 218, y + 94, 760, 44, '800 36px system-ui', '#ffffff', 'left');
          drawTextBlock(cap.desc, 218, y + 150, 760, 40, '500 29px system-ui', '#cbd5e1', 'left');
        });

        drawTextBlock(
          'Tu negocio vende mejor con una app así; fideliza tus clientes',
          540, 1495, 920, 56, '800 42px system-ui', '#22d3ee', 'center'
        );
      }

      // ESCENA 5 (21s - 25s): Cierre con Logo + Robot + CTA WhatsApp
      else {
        roundRect(64, 210, 952, 1410, 48, '#0f172a', '#22d3ee66', 3);

        drawRealLogoBox(455, 455, 360, 270, '#ffffff');
        drawAnimatedRobot(815, 470, sec, 1.15);

        drawTextBlock('AbbaMend Full-Stack AI Builder', 540, 685, 860, 60, '900 48px system-ui', '#ffffff', 'center');
        drawTextBlock(
          'Catálogos & Menús • Fidelización • Automatización • Software a Medida',
          540, 765, 840, 42, '600 29px system-ui', '#38bdf8', 'center'
        );

        roundRect(114, 885, 852, 205, 32, '#13263f', '#1e293b', 2);
        drawTextBlock(
          'Tu negocio vende mejor con una app así; fideliza tus clientes',
          540, 955, 800, 46, '800 35px system-ui', '#ffffff', 'center'
        );
        drawTextBlock(
          'Escríbenos y armamos una demo adaptada a tu rubro',
          540, 1045, 800, 38, '500 28px system-ui', '#cbd5e1', 'center'
        );

        // Respaldo visual en canvas (el enlace clicable real está en #waCtaOverlay)
        const pulse = 1 + Math.sin(sec * 10) * 0.025;
        ctx.save();
        ctx.translate(540, 1380);
        ctx.scale(pulse, pulse);
        roundRect(-375, -68, 750, 136, 68, '#10b981');
        drawTextBlock('Solicitar Demo por WhatsApp  →', 0, 14, 710, 38, '900 35px system-ui', '#042316', 'center');
        ctx.restore();
      }
    }

    function playAnimation(onComplete) {
      cancelAnimationFrame(animId);
      startTime = performance.now();

      function loop(now) {
        const elapsed = now - startTime;
        renderFrame(elapsed);
        if (elapsed < DURATION) {
          animId = requestAnimationFrame(loop);
        } else if (onComplete) {
          onComplete();
        }
      }
      animId = requestAnimationFrame(loop);
    }

    document.getElementById('btnPlay').onclick = () => {
      statusEl.textContent = 'Reproduciendo vista previa (25s)...';
      playAnimation(() => { statusEl.textContent = 'Vista previa finalizada.'; });
    };

    document.getElementById('btnRecord').onclick = () => {
      const stream = canvas.captureStream(60);
      const recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
      const chunks = [];

      recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'abbamend-promo-robot-25s.webm';
        a.click();
        statusEl.textContent = '¡Video descargado! Listo para subir a Supabase Storage o redes.';
      };

      statusEl.textContent = 'Grabando 25 segundos en tiempo real... No cierres la pestaña.';
      recorder.start();
      playAnimation(() => recorder.stop());
    };

    // Inicia en la escena del robot (18s) para ver el movimiento de inmediato
    renderFrame(18000);
  </script>
</body>
</html>
