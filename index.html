<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AbbaMend Promo 4K — Logo Centrado Grande Sin Robot Inferior</title>
  <style>
    body {
      margin: 0;
      background: #04070d;
      color: #f8fafc;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 16px;
    }
    .stage-wrapper {
      position: relative;
      height: 75vh;
      aspect-ratio: 9 / 16;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.85);
      border: 1px solid #1e293b;
      background: #070b14;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    #waCtaOverlay {
      position: absolute;
      left: 50%;
      top: 93.2%;
      transform: translate(-50%, -50%);
      width: 84%;
      padding: 13px 18px;
      border-radius: 999px;
      background: #10b981;
      color: #042316;
      font-weight: 900;
      font-size: clamp(12px, 1.75vh, 18px);
      line-height: 1.15;
      white-space: nowrap;
      text-align: center;
      text-decoration: none;
      box-shadow: 0 12px 30px rgba(16, 185, 129, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      z-index: 10;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    #waCtaOverlay:hover {
      background: #34d399;
      transform: translate(-50%, -52%) scale(1.02);
    }
    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      padding: 12px 22px;
      border-radius: 12px;
      border: none;
      font-weight: 800;
      cursor: pointer;
      font-size: 14px;
      transition: transform 0.15s ease;
    }
    button:active { transform: scale(0.97); }
    #btnPlay { background: #1e293b; color: #f8fafc; border: 1px solid #334155; }
    #btnRecord { background: #06b6d4; color: #04131a; }
    #status { font-size: 13px; color: #94a3b8; text-align: center; padding: 0 16px; }
  </style>
</head>
<body>

  <div class="stage-wrapper">
    <canvas id="stage" width="2160" height="3840"></canvas>
    <a id="waCtaOverlay" target="_blank" rel="noopener noreferrer">
      Solicitar Demo por WhatsApp →
    </a>
  </div>

  <div class="controls">
    <button id="btnPlay">▶ Vista Previa 4K (25s)</button>
    <button id="btnRecord">⏺ Grabar y Descargar 4K (.webm)</button>
  </div>
  <div id="status">Listo en Ultra HD 4K (2160x3840). Cargando logoAbbaMend.png...</div>

  <script>
    // =========================================================================
    // CONFIGURA AQUÍ TU NÚMERO DE WHATSAPP (ej. Ecuador: '593981833974')
    // =========================================================================
    const WHATSAPP_PHONE = 'TU_NUMERO_WHATSAPP';
    const WHATSAPP_MESSAGE = 'Hola AbbaMend, vi el video de la app con menú y puntos de fidelización y quiero una demo para mi negocio.';
    const WHATSAPP_URL = `https://wa.me/${WHATSAPP_PHONE}?text=${encodeURIComponent(WHATSAPP_MESSAGE)}`;

    const waBtn = document.getElementById('waCtaOverlay');
    waBtn.href = WHATSAPP_URL;

    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');

    const DURATION = 25000;
    let startTime = null;
    let animId = null;

    // Logo PNG sin fondo de AbbaMend
    const abbaLogo = new Image();
    abbaLogo.crossOrigin = 'anonymous';
    abbaLogo.src = './logoAbbaMend.png';
    let logoLoaded = false;
    abbaLogo.onload = () => {
      logoLoaded = true;
      statusEl.textContent = 'Logo logoAbbaMend.png cargado. Listo para grabar en 4K.';
      renderFrame(performance.now() - (startTime || performance.now()));
    };

    function roundRect(x, y, w, h, r, fill, stroke = null, lineWidth = 3) {
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, r);
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lineWidth; ctx.stroke(); }
    }

    function wrapLines(text, maxWidth, font) {
      ctx.font = font;
      const words = text.split(' ');
      const lines = [];
      let current = '';

      for (let i = 0; i < words.length; i++) {
        const word = words[i];
        const test = current ? `${current} ${word}` : word;
        if (ctx.measureText(test).width <= maxWidth) {
          current = test;
        } else {
          if (current) lines.push(current);
          current = word;
        }
      }
      if (current) lines.push(current);
      return lines;
    }

    function drawTextBlock(text, x, y, maxWidth, lineHeight, font, color, align = 'left') {
      const lines = wrapLines(text, maxWidth, font);
      ctx.font = font;
      ctx.fillStyle = color;
      ctx.textAlign = align;
      lines.forEach((line, idx) => {
        ctx.fillText(line, x, y + idx * lineHeight);
      });
      return lines.length * lineHeight;
    }

    function drawLogoFitted(cx, cy, maxW, maxH, bgCard = null, glowStrength = 34) {
      if (bgCard) {
        roundRect(cx - maxW / 2 - 8, cy - maxH / 2 - 8, maxW + 16, maxH + 16, 20, bgCard, '#38bdf844', 2);
      }
      if (!logoLoaded) {
        drawTextBlock('abbá MEND', cx, cy + 8, maxW, 28, '900 24px system-ui', '#22d3ee', 'center');
        return;
      }
      const ratio = abbaLogo.naturalWidth / abbaLogo.naturalHeight || 1;
      let w = maxW;
      let h = w / ratio;
      if (h > maxH) {
        h = maxH;
        w = h * ratio;
      }

      ctx.save();
      ctx.shadowColor = 'rgba(34, 211, 238, 0.55)';
      ctx.shadowBlur = glowStrength;
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = 5;
      ctx.drawImage(abbaLogo, cx - w / 2, cy - h / 2, w, h);
      ctx.restore();
    }

    // Logo inferior grande, centrado y moviéndose
    function drawAnimatedBottomLogo(cx, cy, sec) {
      const floatY = Math.sin(sec * 3.8) * 10;
      const swayX = Math.cos(sec * 2.2) * 8;
      const pulseScale = 1 + Math.sin(sec * 4.5) * 0.05;

      ctx.save();
      ctx.translate(cx + swayX, cy + floatY);
      ctx.scale(pulseScale, pulseScale);
      drawLogoFitted(0, 0, 560, 250, null, 48);
      ctx.restore();
    }

    function drawAppScreen(x, y, w, h, sec, mode = 'menu') {
      ctx.save();

      roundRect(x - 24, y - 24, w + 48, h + 48, 56, '#111827', '#38bdf8', 5);
      roundRect(x - 10, y - 10, w + 20, h + 20, 44, '#030712', '#1e293b', 2);

      roundRect(x, y, w, h, 36, '#faf5ef');
      ctx.clip();

      const notchW = 148;
      const notchH = 24;
      roundRect(x + w / 2 - notchW / 2, y + 6, notchW, notchH, 12, '#111827');

      const topH = Math.round(h * 0.115);
      roundRect(x, y, w, topH, 0, '#2c1810');

      const rBadge = Math.min(36, Math.round(topH * 0.30));
      ctx.beginPath();
      ctx.arc(x + 56, y + topH * 0.58, rBadge, 0, Math.PI * 2);
      ctx.fillStyle = '#f59e0b';
      ctx.fill();
      drawTextBlock('AG', x + 56, y + topH * 0.58 + 9, rBadge * 1.8, 28, '900 24px system-ui', '#2c1810', 'center');

      drawTextBlock('ALBA & GRANO', x + 104, y + topH * 0.52, w * 0.52, 32, '900 31px system-ui', '#ffffff', 'left');
      drawTextBlock('Menú Digital & Puntos', x + 104, y + topH * 0.80, w * 0.52, 24, '600 20px system-ui', '#fde68a', 'left');

      roundRect(x + w - 200, y + topH * 0.34, 174, topH * 0.48, 16, mode === 'menu' ? '#10b981' : '#f59e0b');
      drawTextBlock(
        mode === 'menu' ? '● Carta' : '★ Premio',
        x + w - 113, y + topH * 0.65, 154, 26, '900 22px system-ui',
        mode === 'menu' ? '#042316' : '#2c1810', 'center'
      );

      const bodyY = y + topH + 20;
      const bodyH = h - topH - 56;

      if (mode === 'menu') {
        roundRect(x + 22, bodyY, w - 44, bodyH * 0.19, 22, '#f3e7d8', '#e2d0b9', 2);
        drawTextBlock('ALBA & GRANO • MARCA DEMO', x + 42, bodyY + 34, w - 84, 24, '800 18px system-ui', '#7c2d12', 'left');
        drawTextBlock('Pide fácil y acumula puntos hoy', x + 42, bodyY + 74, w - 84, 36, '900 32px system-ui', '#1c1917', 'left');
        drawTextBlock('Cada pedido suma para café y bocados gratis', x + 42, bodyY + bodyH * 0.19 - 16, w - 84, 24, '600 21px system-ui', '#57534e', 'left');

        const items = [
          { name: 'Combo Desayuno Alba', sub: '+20 pts • Tigrillo + Café pasado', price: '$4.50', at: 1.0 },
          { name: 'Corviche Crocante (2u)', sub: '+15 pts • Con salsa de maní', price: '$3.20', at: 2.6 },
          { name: 'Cold Brew & Empanada', sub: '+15 pts • Meta para premio', price: '$3.80', at: 4.2 }
        ];

        const localT = sec % 6.5;
        let total = 0;
        let count = 0;
        let pointsEarned = 0;
        const listY = bodyY + bodyH * 0.22;
        const itemH = Math.min(185, (bodyH * 0.58) / 3);

        let activeTapY = null;

        items.forEach((it, idx) => {
          const iy = listY + idx * (itemH + 16);
          const picked = localT >= it.at;
          const justTapped = localT >= it.at && localT < it.at + 0.65;
          if (justTapped) activeTapY = iy + itemH * 0.52;

          if (picked) {
            total += parseFloat(it.price.replace('$', ''));
            count++;
            pointsEarned += idx === 0 ? 20 : 15;
          }

          roundRect(x + 22, iy, w - 44, itemH, 20, picked ? '#ecfdf5' : '#ffffff', picked ? '#10b981' : '#e5d8c8', 3);
          drawTextBlock(it.name, x + 42, iy + 46, w * 0.66, 32, '800 27px system-ui', '#1c1917', 'left');
          drawTextBlock(it.sub, x + 42, iy + 80, w * 0.66, 26, '700 21px system-ui', '#7c2d12', 'left');
          drawTextBlock(it.price, x + 42, iy + itemH - 18, 220, 30, '900 28px system-ui', '#047857', 'left');

          roundRect(x + w - 192, iy + itemH * 0.26, 148, itemH * 0.48, 16, picked ? '#10b981' : '#2c1810');
          drawTextBlock(picked ? '✓ Sumado' : '+ Pedir', x + w - 118, iy + itemH * 0.56, 134, 28, '900 22px system-ui', picked ? '#042316' : '#ffffff', 'center');
        });

        if (activeTapY !== null) {
          const rippleR = 22 + ((localT % 0.65) / 0.65) * 38;
          ctx.strokeStyle = 'rgba(6, 182, 212, 0.9)';
          ctx.lineWidth = 5;
          ctx.beginPath();
          ctx.arc(x + w - 118, activeTapY, rippleR, 0, Math.PI * 2);
          ctx.stroke();
        }

        const barY = y + h - 116;
        roundRect(x + 22, barY, w - 44, 74, 20, count > 0 ? '#15803d' : '#2c1810');
        drawTextBlock(
          `WhatsApp (${count}) • $${total.toFixed(2)} (+${pointsEarned} pts)`,
          x + 42, barY + 46, w * 0.74, 30, '800 24px system-ui', '#ffffff', 'left'
        );
        drawTextBlock('Enviar →', x + w - 120, barY + 46, 102, 30, '900 24px system-ui', '#dcfce7', 'center');
      } else {
        const visits = Math.min(5, Math.floor((sec - 10.5) * 1.15) + 1);
        const unlocked = visits === 5;

        roundRect(x + 22, bodyY, w - 44, bodyH * 0.48, 24, '#2c1810');
        drawTextBlock('PUNTOS Y BENEFICIOS DEL CLIENTE', x + 42, bodyY + 44, w - 84, 28, '800 20px system-ui', '#fbbf24', 'left');
        drawTextBlock('ALBA & GRANO REWARDS', x + 42, bodyY + 86, w - 84, 38, '900 34px system-ui', '#ffffff', 'left');
        drawTextBlock(
          unlocked
            ? '¡META CUMPLIDA! 50/50 PUNTOS'
            : `Acumulado: ${visits * 10} de 50 puntos`,
          x + 42, bodyY + 130, w - 84, 30, '800 24px system-ui',
          unlocked ? '#34d399' : '#fde68a', 'left'
        );

        const starY = bodyY + bodyH * 0.35;
        const gap = (w - 130) / 4;
        for (let i = 0; i < 5; i++) {
          const sx = x + 65 + i * gap;
          const active = i < visits;
          ctx.beginPath();
          ctx.arc(sx, starY, 38, 0, Math.PI * 2);
          ctx.fillStyle = active ? '#f59e0b' : '#44271b';
          ctx.fill();
          drawTextBlock(active ? '★' : `${(i + 1) * 10}`, sx, starY + 11, 60, 30, '900 23px system-ui', active ? '#2c1810' : '#d6d3d1', 'center');
        }

        const rewardY = bodyY + bodyH * 0.52;
        roundRect(
          x + 22, rewardY, w - 44, bodyH * 0.44, 24,
          unlocked ? '#ecfdf5' : '#ffffff',
          unlocked ? '#10b981' : '#e5d8c8',
          unlocked ? 4 : 3
        );

        drawTextBlock(
          unlocked ? '🎉 BENEFICIO DESBLOQUEADO' : 'PREMIO AL COMPLETAR TUS PUNTOS',
          x + 42, rewardY + 46, w - 84, 28, '900 20px system-ui',
          unlocked ? '#047857' : '#7c2d12', 'left'
        );

        drawTextBlock(
          unlocked
            ? '¡Ganaste 1 Café Pasado + Empanada GRATIS!'
            : 'Gana 1 Café Pasado + Empanada GRATIS',
          x + 42, rewardY + 96, w - 84, 42, '900 33px system-ui', '#1c1917', 'left'
        );

        drawTextBlock(
          unlocked
            ? '✓ Canjeable hoy mismo en tu próxima visita'
            : 'Tus clientes vuelven solos para reclamar su premio',
          x + 42, rewardY + bodyH * 0.44 - 30, w - 84, 28, '700 22px system-ui',
          unlocked ? '#065f46' : '#57534e', 'left'
        );
      }

      roundRect(x + w / 2 - 90, y + h - 22, 180, 8, 4, '#334155');

      ctx.restore();
    }

    function drawActiveRobot(cx, cy, sec, scale = 0.56, targetScreenX = 240, targetScreenY = 850) {
      const walkX = Math.sin(sec * 2.2) * 10;
      const bounceY = Math.abs(Math.sin(sec * 4.4)) * -7;
      const legSwing = Math.sin(sec * 4.4) * 0.30;
      const headTurn = Math.sin(sec * 2.8) * 0.14;
      const blink = (sec % 3.0) > 2.84;

      const rx = cx + walkX;
      const ry = cy + bounceY;

      const logoAboveY = ry - 275 * scale + Math.sin(sec * 3.5) * 4;
      drawLogoFitted(rx + 18, logoAboveY, 330 * scale, 190 * scale, null, 30);

      ctx.save();
      ctx.translate(rx, ry);
      ctx.scale(scale, scale);

      const shadow = ctx.createRadialGradient(0, 235, 8, 0, 235, 130);
      shadow.addColorStop(0, 'rgba(6, 182, 212, 0.45)');
      shadow.addColorStop(1, 'rgba(6, 182, 212, 0)');
      ctx.fillStyle = shadow;
      ctx.beginPath();
      ctx.ellipse(0, 235, 130, 24, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.save();
      ctx.translate(-46, 105);
      ctx.rotate(legSwing);
      roundRect(-18, 0, 36, 95, 16, '#e2e8f0', '#94a3b8', 2.5);
      roundRect(-24, 86, 54, 34, 14, '#0284c7');
      ctx.restore();

      ctx.save();
      ctx.translate(46, 105);
      ctx.rotate(-legSwing);
      roundRect(-18, 0, 36, 95, 16, '#e2e8f0', '#94a3b8', 2.5);
      roundRect(-24, 86, 54, 34, 14, '#0284c7');
      ctx.restore();

      ctx.save();
      ctx.translate(-86, 12);
      ctx.rotate(-0.55 + Math.sin(sec * 6) * 0.25);
      roundRect(-14, 0, 28, 76, 14, '#f8fafc', '#94a3b8', 2.5);
      ctx.fillStyle = '#10b981';
      ctx.beginPath();
      ctx.arc(0, 82, 14, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      const torsoGrad = ctx.createLinearGradient(-84, -15, 84, 120);
      torsoGrad.addColorStop(0, '#ffffff');
      torsoGrad.addColorStop(1, '#cbd5e1');
      roundRect(-84, -15, 168, 132, 44, torsoGrad, '#94a3b8', 3);

      roundRect(-36, 22, 72, 54, 16, '#0f172a', '#22d3ee', 2.5);
      drawTextBlock('AM', 0, 58, 66, 28, '900 26px system-ui', '#22d3ee', 'center');

      ctx.save();
      ctx.translate(0, -95);
      ctx.rotate(headTurn);

      const headGrad = ctx.createLinearGradient(-66, -62, 66, 36);
      headGrad.addColorStop(0, '#ffffff');
      headGrad.addColorStop(1, '#cbd5e1');
      roundRect(-66, -62, 132, 98, 42, headGrad, '#94a3b8', 3);

      roundRect(-48, -36, 96, 46, 20, '#090d16');
      if (blink) {
        ctx.strokeStyle = '#22d3ee';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(-30, -13);
        ctx.lineTo(-10, -13);
        ctx.moveTo(10, -13);
        ctx.lineTo(30, -13);
        ctx.stroke();
      } else {
        ctx.fillStyle = '#22d3ee';
        ctx.beginPath();
        ctx.arc(-20, -13, 10, 0, Math.PI * 2);
        ctx.arc(20, -13, 10, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      ctx.save();
      ctx.translate(82, 16);
      const reachAngle = -0.25 + Math.sin(sec * 4.2) * 0.16;
      ctx.rotate(reachAngle);
      roundRect(0, -12, 118, 26, 13, '#f8fafc', '#94a3b8', 2.5);
      ctx.fillStyle = '#22d3ee';
      ctx.beginPath();
      ctx.arc(124, 1, 15, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      ctx.restore();

      const handWorldX = rx + 175 * scale;
      const handWorldY = ry + 10 * scale;
      ctx.save();
      ctx.strokeStyle = 'rgba(34, 211, 238, 0.35)';
      ctx.setLineDash([10, 10]);
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(handWorldX, handWorldY);
      ctx.lineTo(targetScreenX, targetScreenY);
      ctx.stroke();
      ctx.restore();
    }

    function drawTopHeader(sec) {
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, 0, 1080, 10);
      const grad = ctx.createLinearGradient(0, 0, 1080, 0);
      grad.addColorStop(0, '#06b6d4');
      grad.addColorStop(1, '#10b981');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, (Math.min(sec * 1000, DURATION) / DURATION) * 1080, 10);

      roundRect(48, 22, 984, 104, 52, '#0f172a', '#1e293b', 2);
      drawLogoFitted(110, 74, 96, 80, null, 20);

      drawTextBlock('AbbaMend', 170, 68, 510, 32, '800 29px system-ui', '#ffffff', 'left');
      drawTextBlock('App Menú Digital • Puntos & Premios • Software IA', 170, 99, 540, 24, '500 20px system-ui', '#38bdf8', 'left');

      roundRect(755, 42, 245, 64, 32, '#06b6d4');
      drawTextBlock('Demo en Vivo', 877, 82, 220, 28, '800 23px system-ui', '#04131a', 'center');
    }

    function renderFrame(elapsed) {
      const t = Math.min(elapsed, DURATION);
      const sec = t / 1000;

      waBtn.style.display = sec >= 21 ? 'flex' : 'none';

      ctx.save();
      ctx.scale(2, 2);

      const bg = ctx.createLinearGradient(0, 0, 0, 1920);
      bg.addColorStop(0, '#050911');
      bg.addColorStop(0.5, '#0b1324');
      bg.addColorStop(1, '#060a13');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, 1080, 1920);

      drawTopHeader(sec);

      const mode = sec < 10.5 ? 'menu' : (sec < 17 ? 'loyalty' : 'menu');

      drawTextBlock(
        mode === 'menu'
          ? 'Tu menú digital que vende y suma puntos solo'
          : 'Premia compras y haz que tus clientes vuelvan',
        540, 174, 990, 44, '900 40px system-ui', '#ffffff', 'center'
      );

      const screenX = 215;
      const screenW = 825;
      const screenTop = 264;
      const screenH = 1060;
      const robotY = 950;

      drawAppScreen(screenX, screenTop, screenW, screenH, sec, mode);

      drawActiveRobot(102, robotY, sec, 0.56, screenX + 12, screenTop + screenH * 0.45);

      drawTextBlock(
        'Tu negocio vende mejor con una app así; fideliza tus clientes',
        540, 1415, 970, 50, '800 42px system-ui', '#ffffff', 'center'
      );

      // Solo el logo de AbbaMend grande y en movimiento en el centro inferior
      drawAnimatedBottomLogo(540, 1625, sec);

      ctx.restore();
    }

    function playAnimation(onComplete) {
      cancelAnimationFrame(animId);
      startTime = performance.now();

      function loop(now) {
        const elapsed = now - startTime;
        renderFrame(elapsed);
        if (elapsed < DURATION) {
          animId = requestAnimationFrame(loop);
        } else if (onComplete) {
          onComplete();
        }
      }
      animId = requestAnimationFrame(loop);
    }

    document.getElementById('btnPlay').onclick = () => {
      statusEl.textContent = 'Reproduciendo vista previa 4K (25s)...';
      playAnimation(() => { statusEl.textContent = 'Vista previa finalizada.'; });
    };

    document.getElementById('btnRecord').onclick = () => {
      const stream = canvas.captureStream(30);
      const options = {
        mimeType: 'video/webm;codecs=vp9',
        videoBitsPerSecond: 25000000
      };

      let recorder;
      try {
        recorder = new MediaRecorder(stream, options);
      } catch (err) {
        recorder = new MediaRecorder(stream);
      }

      const chunks = [];

      recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'abbamend-promo-4k-final-25s.webm';
        a.click();
        statusEl.textContent = '¡Video Ultra HD 4K descargado!';
      };

      statusEl.textContent = 'Grabando 25s en Ultra HD 4K (2160x3840)... No cierres la pestaña.';
      recorder.start();
      playAnimation(() => recorder.stop());
    };

    renderFrame(22000);
  </script>
</body>
</html>
