<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AbbaMend Promo 4K — Menú Digital + Premios de Fidelización</title>
  <style>
    body {
      margin: 0;
      background: #04070d;
      color: #f8fafc;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 16px;
    }
    .stage-wrapper {
      position: relative;
      height: 75vh;
      aspect-ratio: 9 / 16;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.85);
      border: 1px solid #1e293b;
      background: #070b14;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    #waCtaOverlay {
      position: absolute;
      left: 50%;
      top: 86%;
      transform: translate(-50%, -50%);
      width: 74%;
      padding: 15px 20px;
      border-radius: 999px;
      background: #10b981;
      color: #042316;
      font-weight: 900;
      font-size: clamp(14px, 2.1vh, 21px);
      text-align: center;
      text-decoration: none;
      box-shadow: 0 12px 30px rgba(16, 185, 129, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      z-index: 10;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    #waCtaOverlay:hover {
      background: #34d399;
      transform: translate(-50%, -52%) scale(1.02);
    }
    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      padding: 12px 22px;
      border-radius: 12px;
      border: none;
      font-weight: 800;
      cursor: pointer;
      font-size: 14px;
      transition: transform 0.15s ease;
    }
    button:active { transform: scale(0.97); }
    #btnPlay { background: #1e293b; color: #f8fafc; border: 1px solid #334155; }
    #btnRecord { background: #06b6d4; color: #04131a; }
    #status { font-size: 13px; color: #94a3b8; text-align: center; padding: 0 16px; }
  </style>
</head>
<body>

  <div class="stage-wrapper">
    <canvas id="stage" width="2160" height="3840"></canvas>
    <a id="waCtaOverlay" target="_blank" rel="noopener noreferrer">
      Solicitar Demo por WhatsApp →
    </a>
  </div>

  <div class="controls">
    <button id="btnPlay">▶ Vista Previa (25s)</button>
    <button id="btnRecord">⏺ Grabar y Descargar 4K (.webm)</button>
  </div>
  <div id="status">Listo en Ultra HD 4K (2160x3840). Cargando logoAbbaMend.png...</div>

  <script>
    // =========================================================================
    // CONFIGURA AQUÍ TU NÚMERO DE WHATSAPP (ej. Ecuador: '5939XXXXXXXX')
    // =========================================================================
    const WHATSAPP_PHONE = 'TU_NUMERO_WHATSAPP';
    const WHATSAPP_MESSAGE = 'Hola AbbaMend, vi el video de la app con menú y puntos de fidelización y quiero una demo para mi negocio.';
    const WHATSAPP_URL = `https://wa.me/${WHATSAPP_PHONE}?text=${encodeURIComponent(WHATSAPP_MESSAGE)}`;

    const waBtn = document.getElementById('waCtaOverlay');
    waBtn.href = WHATSAPP_URL;

    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');

    const DURATION = 25000;
    let startTime = null;
    let animId = null;

    // Logo PNG sin fondo de AbbaMend
    const abbaLogo = new Image();
    abbaLogo.crossOrigin = 'anonymous';
    abbaLogo.src = './logoAbbaMend.png';
    let logoLoaded = false;
    abbaLogo.onload = () => {
      logoLoaded = true;
      statusEl.textContent = 'Logo logoAbbaMend.png cargado. Listo para exportar en 4K (2160x3840).';
      renderFrame(performance.now() - (startTime || performance.now()));
    };

    function roundRect(x, y, w, h, r, fill, stroke = null, lineWidth = 3) {
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, r);
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lineWidth; ctx.stroke(); }
    }

    function wrapLines(text, maxWidth, font) {
      ctx.font = font;
      const words = text.split(' ');
      const lines = [];
      let current = '';

      for (let i = 0; i < words.length; i++) {
        const word = words[i];
        const test = current ? `${current} ${word}` : word;
        if (ctx.measureText(test).width <= maxWidth) {
          current = test;
        } else {
          if (current) lines.push(current);
          current = word;
        }
      }
      if (current) lines.push(current);
      return lines;
    }

    function drawTextBlock(text, x, y, maxWidth, lineHeight, font, color, align = 'left') {
      const lines = wrapLines(text, maxWidth, font);
      ctx.font = font;
      ctx.fillStyle = color;
      ctx.textAlign = align;
      lines.forEach((line, idx) => {
        ctx.fillText(line, x, y + idx * lineHeight);
      });
      return lines.length * lineHeight;
    }

    function drawLogoFitted(cx, cy, maxW, maxH, bgCard = null, glowStrength = 34) {
      if (bgCard) {
        roundRect(cx - maxW / 2 - 8, cy - maxH / 2 - 8, maxW + 16, maxH + 16, 20, bgCard, '#38bdf844', 2);
      }
      if (!logoLoaded) {
        drawTextBlock('abbá MEND', cx, cy + 8, maxW, 28, '900 24px system-ui', '#22d3ee', 'center');
        return;
      }
      const ratio = abbaLogo.naturalWidth / abbaLogo.naturalHeight || 1;
      let w = maxW;
      let h = w / ratio;
      if (h > maxH) {
        h = maxH;
        w = h * ratio;
      }

      ctx.save();
      ctx.shadowColor = 'rgba(34, 211, 238, 0.5)';
      ctx.shadowBlur = glowStrength;
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = 5;
      ctx.drawImage(abbaLogo, cx - w / 2, cy - h / 2, w, h);
      ctx.restore();
    }

    function drawAppScreen(x, y, w, h, sec, mode = 'menu') {
      ctx.save();
      roundRect(x - 14, y - 14, w + 28, h + 28, 34, '#0f172a', '#38bdf8', 4);
      roundRect(x, y, w, h, 24, '#faf5ef');
      ctx.clip();

      const topH = Math.round(h * 0.13);
      roundRect(x, y, w, topH, 0, '#2c1810');

      const rBadge = Math.min(28, Math.round(topH * 0.34));
      ctx.beginPath();
      ctx.arc(x + 44, y + topH / 2, rBadge, 0, Math.PI * 2);
      ctx.fillStyle = '#f59e0b';
      ctx.fill();
      drawTextBlock('AG', x + 44, y + topH / 2 + 8, rBadge * 1.8, 24, '900 20px system-ui', '#2c1810', 'center');

      drawTextBlock('ALBA & GRANO', x + 84, y + topH / 2 - 2, w * 0.5, 28, '900 25px system-ui', '#ffffff', 'left');
      drawTextBlock('Menú Digital & Puntos', x + 84, y + topH / 2 + 24, w * 0.5, 20, '500 17px system-ui', '#fde68a', 'left');

      roundRect(x + w - 170, y + topH * 0.22, 146, topH * 0.56, 14, mode === 'menu' ? '#10b981' : '#f59e0b');
      drawTextBlock(
        mode === 'menu' ? '● Carta' : '★ Premio',
        x + w - 97, y + topH / 2 + 7, 134, 22, '900 18px system-ui',
        mode === 'menu' ? '#042316' : '#2c1810', 'center'
      );

      const bodyY = y + topH + 16;
      const bodyH = h - topH - 28;

      if (mode === 'menu') {
        roundRect(x + 18, bodyY, w - 36, bodyH * 0.24, 18, '#f3e7d8', '#e2d0b9', 2);
        drawTextBlock('ALBA & GRANO • MARCA DEMO', x + 36, bodyY + 32, w - 72, 22, '800 16px system-ui', '#7c2d12', 'left');
        drawTextBlock('Pide fácil y acumula puntos hoy', x + 36, bodyY + 68, w - 72, 32, '900 25px system-ui', '#1c1917', 'left');
        drawTextBlock('Cada compra suma para café y bocados gratis', x + 36, bodyY + bodyH * 0.24 - 16, w - 72, 22, '600 17px system-ui', '#57534e', 'left');

        const items = [
          { name: 'Combo Desayuno Alba', sub: '+20 pts • Tigrillo + Café pasado', price: '$4.50', at: 1.0 },
          { name: 'Corviche Crocante (2u)', sub: '+15 pts • Con salsa de maní', price: '$3.20', at: 2.6 },
          { name: 'Cold Brew & Empanada', sub: '+15 pts • Meta para premio', price: '$3.80', at: 4.2 }
        ];

        const localT = sec % 6.5;
        let total = 0;
        let count = 0;
        let pointsEarned = 0;
        const listY = bodyY + bodyH * 0.27;
        const itemH = Math.min(112, (bodyH * 0.48) / 3);

        let activeTapY = null;

        items.forEach((it, idx) => {
          const iy = listY + idx * (itemH + 12);
          const picked = localT >= it.at;
          const justTapped = localT >= it.at && localT < it.at + 0.65;
          if (justTapped) activeTapY = iy + itemH * 0.52;

          if (picked) {
            total += parseFloat(it.price.replace('$', ''));
            count++;
            pointsEarned += idx === 0 ? 20 : 15;
          }

          roundRect(x + 18, iy, w - 36, itemH, 16, picked ? '#ecfdf5' : '#ffffff', picked ? '#10b981' : '#e5d8c8', 2.5);
          drawTextBlock(it.name, x + 34, iy + 34, w * 0.62, 25, '800 20px system-ui', '#1c1917', 'left');
          drawTextBlock(it.sub, x + 34, iy + 60, w * 0.62, 21, '600 16px system-ui', '#7c2d12', 'left');
          drawTextBlock(it.price, x + 34, iy + itemH - 12, 180, 22, '900 20px system-ui', '#047857', 'left');

          roundRect(x + w - 156, iy + itemH * 0.26, 120, itemH * 0.48, 12, picked ? '#10b981' : '#2c1810');
          drawTextBlock(picked ? '✓ Sumado' : '+ Pedir', x + w - 96, iy + itemH * 0.56, 110, 22, '800 18px system-ui', picked ? '#042316' : '#ffffff', 'center');
        });

        if (activeTapY !== null) {
          const rippleR = 16 + ((localT % 0.65) / 0.65) * 28;
          ctx.strokeStyle = 'rgba(6, 182, 212, 0.85)';
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.arc(x + w - 96, activeTapY, rippleR, 0, Math.PI * 2);
          ctx.stroke();
        }

        const barY = y + h - 82;
        roundRect(x + 18, barY, w - 36, 64, 16, count > 0 ? '#15803d' : '#2c1810');
        drawTextBlock(
          `WhatsApp (${count}) • $${total.toFixed(2)} (+${pointsEarned} pts)`,
          x + 34, barY + 40, w * 0.68, 24, '800 19px system-ui', '#ffffff', 'left'
        );
        drawTextBlock('Enviar →', x + w - 105, barY + 40, 88, 24, '900 19px system-ui', '#dcfce7', 'center');
      } else {
        // Escena de Fidelización: Premio concreto ganado (Café pasado + Empanada GRATIS)
        const visits = Math.min(5, Math.floor((sec - 10.5) * 1.15) + 1);
        const unlocked = visits === 5;

        roundRect(x + 18, bodyY, w - 36, bodyH * 0.52, 20, '#2c1810');
        drawTextBlock('PUNTOS Y BENEFICIOS DEL CLIENTE', x + 36, bodyY + 36, w - 72, 24, '800 16px system-ui', '#fbbf24', 'left');
        drawTextBlock('ALBA & GRANO REWARDS', x + 36, bodyY + 70, w - 72, 30, '900 25px system-ui', '#ffffff', 'left');
        drawTextBlock(
          unlocked
            ? '¡META CUMPLIDA! 50/50 PUNTOS'
            : `Acumulado: ${visits * 10} de 50 puntos`,
          x + 36, bodyY + 108, w - 72, 24, '800 19px system-ui',
          unlocked ? '#34d399' : '#fde68a', 'left'
        );

        const starY = bodyY + bodyH * 0.37;
        const gap = (w - 96) / 4;
        for (let i = 0; i < 5; i++) {
          const sx = x + 48 + i * gap;
          const active = i < visits;
          ctx.beginPath();
          ctx.arc(sx, starY, 26, 0, Math.PI * 2);
          ctx.fillStyle = active ? '#f59e0b' : '#44271b';
          ctx.fill();
          drawTextBlock(active ? '★' : `${(i + 1) * 10}`, sx, starY + 8, 44, 24, '900 17px system-ui', active ? '#2c1810' : '#d6d3d1', 'center');
        }

        // Tarjeta inferior de premio ganado claramente legible
        const rewardY = bodyY + bodyH * 0.56;
        roundRect(
          x + 18, rewardY, w - 36, bodyH * 0.41, 20,
          unlocked ? '#ecfdf5' : '#ffffff',
          unlocked ? '#10b981' : '#e5d8c8',
          unlocked ? 3.5 : 2
        );

        drawTextBlock(
          unlocked ? '🎉 BENEFICIO DESBLOQUEADO' : 'PREMIO AL COMPLETAR TUS PUNTOS',
          x + 36, rewardY + 34, w - 72, 22, '900 16px system-ui',
          unlocked ? '#047857' : '#7c2d12', 'left'
        );

        drawTextBlock(
          unlocked
            ? '¡Ganaste 1 Café Pasado + Empanada GRATIS!'
            : 'Gana 1 Café Pasado + Empanada GRATIS',
          x + 36, rewardY + 72, w - 72, 31, '900 24px system-ui', '#1c1917', 'left'
        );

        drawTextBlock(
          unlocked
            ? '✓ Canjeable hoy mismo en tu próxima visita'
            : 'Tus clientes vuelven solos para reclamar su premio',
          x + 36, rewardY + 146, w - 72, 22, '700 17px system-ui',
          unlocked ? '#065f46' : '#57534e', 'left'
        );
      }

      ctx.restore();
    }

    function drawActiveRobot(cx, cy, sec, scale = 1, targetScreenX = 680, targetScreenY = 920) {
      const walkX = Math.sin(sec * 2.2) * 20;
      const bounceY = Math.abs(Math.sin(sec * 4.4)) * -10;
      const legSwing = Math.sin(sec * 4.4) * 0.32;
      const headTurn = Math.sin(sec * 2.8) * 0.14;
      const blink = (sec % 3.0) > 2.84;

      const rx = cx + walkX;
      const ry = cy + bounceY;

      // Logo de gran formato encima de la cabeza del robot
      const logoAboveY = ry - 295 * scale + Math.sin(sec * 3.5) * 5;
      drawLogoFitted(rx + 25, logoAboveY, 395 * scale, 225 * scale, null, 36);

      ctx.save();
      ctx.translate(rx, ry);
      ctx.scale(scale, scale);

      const shadow = ctx.createRadialGradient(0, 235, 8, 0, 235, 130);
      shadow.addColorStop(0, 'rgba(6, 182, 212, 0.45)');
      shadow.addColorStop(1, 'rgba(6, 182, 212, 0)');
      ctx.fillStyle = shadow;
      ctx.beginPath();
      ctx.ellipse(0, 235, 130, 24, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.save();
      ctx.translate(-46, 105);
      ctx.rotate(legSwing);
      roundRect(-18, 0, 36, 95, 16, '#e2e8f0', '#94a3b8', 2.5);
      roundRect(-24, 86, 54, 34, 14, '#0284c7');
      ctx.restore();

      ctx.save();
      ctx.translate(46, 105);
      ctx.rotate(-legSwing);
      roundRect(-18, 0, 36, 95, 16, '#e2e8f0', '#94a3b8', 2.5);
      roundRect(-24, 86, 54, 34, 14, '#0284c7');
      ctx.restore();

      ctx.save();
      ctx.translate(-86, 12);
      ctx.rotate(-0.55 + Math.sin(sec * 6) * 0.25);
      roundRect(-14, 0, 28, 76, 14, '#f8fafc', '#94a3b8', 2.5);
      ctx.fillStyle = '#10b981';
      ctx.beginPath();
      ctx.arc(0, 82, 14, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      const torsoGrad = ctx.createLinearGradient(-84, -15, 84, 120);
      torsoGrad.addColorStop(0, '#ffffff');
      torsoGrad.addColorStop(1, '#cbd5e1');
      roundRect(-84, -15, 168, 132, 44, torsoGrad, '#94a3b8', 3);

      roundRect(-36, 22, 72, 54, 16, '#0f172a', '#22d3ee', 2.5);
      drawTextBlock('AM', 0, 58, 66, 28, '900 26px system-ui', '#22d3ee', 'center');

      ctx.save();
      ctx.translate(0, -95);
      ctx.rotate(headTurn);

      const headGrad = ctx.createLinearGradient(-66, -62, 66, 36);
      headGrad.addColorStop(0, '#ffffff');
      headGrad.addColorStop(1, '#cbd5e1');
      roundRect(-66, -62, 132, 98, 42, headGrad, '#94a3b8', 3);

      roundRect(-48, -36, 96, 46, 20, '#090d16');
      if (blink) {
        ctx.strokeStyle = '#22d3ee';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(-30, -13);
        ctx.lineTo(-10, -13);
        ctx.moveTo(10, -13);
        ctx.lineTo(30, -13);
        ctx.stroke();
      } else {
        ctx.fillStyle = '#22d3ee';
        ctx.beginPath();
        ctx.arc(-20, -13, 10, 0, Math.PI * 2);
        ctx.arc(20, -13, 10, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      ctx.save();
      ctx.translate(82, 16);
      const reachAngle = -0.25 + Math.sin(sec * 4.2) * 0.16;
      ctx.rotate(reachAngle);
      roundRect(0, -12, 118, 26, 13, '#f8fafc', '#94a3b8', 2.5);
      ctx.fillStyle = '#22d3ee';
      ctx.beginPath();
      ctx.arc(124, 1, 15, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      ctx.restore();

      const handWorldX = rx + 175 * scale;
      const handWorldY = ry + 10 * scale;
      ctx.save();
      ctx.strokeStyle = 'rgba(34, 211, 238, 0.35)';
      ctx.setLineDash([10, 10]);
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(handWorldX, handWorldY);
      ctx.lineTo(targetScreenX, targetScreenY);
      ctx.stroke();
      ctx.restore();
    }

    function drawTopHeader(sec) {
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, 0, 1080, 10);
      const grad = ctx.createLinearGradient(0, 0, 1080, 0);
      grad.addColorStop(0, '#06b6d4');
      grad.addColorStop(1, '#10b981');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, (Math.min(sec * 1000, DURATION) / DURATION) * 1080, 10);

      roundRect(48, 26, 984, 112, 56, '#0f172a', '#1e293b', 2);
      drawLogoFitted(112, 82, 104, 88, null, 20);

      drawTextBlock('AbbaMend', 176, 75, 510, 32, '800 29px system-ui', '#ffffff', 'left');
      drawTextBlock('App Menú Digital • Puntos & Premios • Software IA', 176, 107, 540, 24, '500 20px system-ui', '#38bdf8', 'left');

      roundRect(755, 50, 245, 64, 32, '#06b6d4');
      drawTextBlock('Demo en Vivo', 877, 90, 220, 28, '800 23px system-ui', '#04131a', 'center');
    }

    function renderFrame(elapsed) {
      const t = Math.min(elapsed, DURATION);
      const sec = t / 1000;

      ctx.save();
      ctx.scale(2, 2);

      waBtn.style.display = sec >= 21 ? 'flex' : 'none';

      const bg = ctx.createLinearGradient(0, 0, 0, 1920);
      bg.addColorStop(0, '#050911');
      bg.addColorStop(0.5, '#0b1324');
      bg.addColorStop(1, '#060a13');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, 1080, 1920);

      drawTopHeader(sec);

      const mode = sec < 10.5 ? 'menu' : (sec < 17 ? 'loyalty' : 'menu');

      drawTextBlock(
        mode === 'menu'
          ? 'Tu menú digital que vende y suma puntos solo'
          : 'Premia compras y haz que tus clientes vuelvan',
        540, 188, 960, 50, '900 41px system-ui', '#ffffff', 'center'
      );

      const screenTop = 530;
      const screenH = 740;
      const robotY = 1055;

      const screenX = 415;
      const screenW = 610;
      drawAppScreen(screenX, screenTop, screenW, screenH, sec, mode);

      drawActiveRobot(205, robotY, sec, 0.94, screenX + 35, screenTop + screenH * 0.45);

      drawTextBlock(
        'Tu negocio vende mejor con una app así; fideliza tus clientes',
        540, 1445, 940, 62, '800 48px system-ui', '#ffffff', 'center'
      );

      if (sec < 21) {
        drawTextBlock(
          mode === 'loyalty'
            ? 'Ejemplo: ganó 1 café pasado + empanada gratis por sus puntos'
            : 'Más pedidos directos por WhatsApp y clientes recurrentes',
          540, 1605, 920, 42, '600 30px system-ui', '#fbbf24', 'center'
        );
      }

      ctx.restore();
    }

    function playAnimation(onComplete) {
      cancelAnimationFrame(animId);
      startTime = performance.now();

      function loop(now) {
        const elapsed = now - startTime;
        renderFrame(elapsed);
        if (elapsed < DURATION) {
          animId = requestAnimationFrame(loop);
        } else if (onComplete) {
          onComplete();
        }
      }
      animId = requestAnimationFrame(loop);
    }

    document.getElementById('btnPlay').onclick = () => {
      statusEl.textContent = 'Reproduciendo vista previa 4K (25s)...';
      playAnimation(() => { statusEl.textContent = 'Vista previa finalizada.'; });
    };

    document.getElementById('btnRecord').onclick = () => {
      const stream = canvas.captureStream(30);
      const options = {
        mimeType: 'video/webm;codecs=vp9',
        videoBitsPerSecond: 25000000
      };

      let recorder;
      try {
        recorder = new MediaRecorder(stream, options);
      } catch (err) {
        recorder = new MediaRecorder(stream);
      }

      const chunks = [];

      recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'abbamend-promo-4k-fidelizacion-25s.webm';
        a.click();
        statusEl.textContent = '¡Video Ultra HD 4K descargado!';
      };

      statusEl.textContent = 'Grabando 25s en Ultra HD 4K (2160x3840)... No cierres la pestaña.';
      recorder.start();
      playAnimation(() => recorder.stop());
    };

    // Inicia en el segundo 14.5 para mostrar de inmediato el premio desbloqueado ("Café Pasado + Empanada GRATIS")
    renderFrame(14500);
  </script>
</body>
</html>
