<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AbbaMend Promo — Robot con Pantalla App Menú Digital</title>
  <style>
    body {
      margin: 0;
      background: #04070d;
      color: #f8fafc;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 16px;
    }
    .stage-wrapper {
      position: relative;
      height: 75vh;
      aspect-ratio: 9 / 16;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.85);
      border: 1px solid #1e293b;
      background: #070b14;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    #waCtaOverlay {
      position: absolute;
      left: 50%;
      top: 86%;
      transform: translate(-50%, -50%);
      width: 74%;
      padding: 15px 20px;
      border-radius: 999px;
      background: #10b981;
      color: #042316;
      font-weight: 900;
      font-size: clamp(14px, 2.1vh, 21px);
      text-align: center;
      text-decoration: none;
      box-shadow: 0 12px 30px rgba(16, 185, 129, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      z-index: 10;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    #waCtaOverlay:hover {
      background: #34d399;
      transform: translate(-50%, -52%) scale(1.02);
    }
    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      padding: 12px 22px;
      border-radius: 12px;
      border: none;
      font-weight: 800;
      cursor: pointer;
      font-size: 14px;
      transition: transform 0.15s ease;
    }
    button:active { transform: scale(0.97); }
    #btnPlay { background: #1e293b; color: #f8fafc; border: 1px solid #334155; }
    #btnRecord { background: #06b6d4; color: #04131a; }
    #status { font-size: 13px; color: #94a3b8; text-align: center; padding: 0 16px; }
  </style>
</head>
<body>

  <div class="stage-wrapper">
    <canvas id="stage" width="1080" height="1920"></canvas>
    <a id="waCtaOverlay" target="_blank" rel="noopener noreferrer">
      Solicitar Demo por WhatsApp →
    </a>
  </div>

  <div class="controls">
    <button id="btnPlay">▶ Vista Previa (25s)</button>
    <button id="btnRecord">⏺ Grabar y Descargar (.webm)</button>
  </div>
  <div id="status">Cargando logoAbbaMend1.png...</div>

  <script>
    // =========================================================================
    // CONFIGURA AQUÍ TU NÚMERO DE WHATSAPP (ej. Ecuador: '5939XXXXXXXX')
    // =========================================================================
    const WHATSAPP_PHONE = 'TU_NUMERO_WHATSAPP';
    const WHATSAPP_MESSAGE = 'Hola AbbaMend, vi el robot con la app de menú digital y quiero solicitar una demo.';
    const WHATSAPP_URL = `https://wa.me/${WHATSAPP_PHONE}?text=${encodeURIComponent(WHATSAPP_MESSAGE)}`;

    const waBtn = document.getElementById('waCtaOverlay');
    waBtn.href = WHATSAPP_URL;

    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');

    const DURATION = 25000;
    let startTime = null;
    let animId = null;

    // Logo oficial de AbbaMend
    const abbaLogo = new Image();
    abbaLogo.crossOrigin = 'anonymous';
    abbaLogo.src = './logoAbbaMend1.png';
    let logoLoaded = false;
    abbaLogo.onload = () => {
      logoLoaded = true;
      statusEl.textContent = 'Logo logoAbbaMend1.png listo. Robot sosteniendo la app en pantalla.';
      renderFrame(performance.now() - (startTime || performance.now()));
    };

    function roundRect(x, y, w, h, r, fill, stroke = null, lineWidth = 3) {
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, r);
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lineWidth; ctx.stroke(); }
    }

    function wrapLines(text, maxWidth, font) {
      ctx.font = font;
      const words = text.split(' ');
      const lines = [];
      let current = '';

      for (let i = 0; i < words.length; i++) {
        const word = words[i];
        const test = current ? `${current} ${word}` : word;
        if (ctx.measureText(test).width <= maxWidth) {
          current = test;
        } else {
          if (current) lines.push(current);
          current = word;
        }
      }
      if (current) lines.push(current);
      return lines;
    }

    function drawTextBlock(text, x, y, maxWidth, lineHeight, font, color, align = 'left') {
      const lines = wrapLines(text, maxWidth, font);
      ctx.font = font;
      ctx.fillStyle = color;
      ctx.textAlign = align;
      lines.forEach((line, idx) => {
        ctx.fillText(line, x, y + idx * lineHeight);
      });
      return lines.length * lineHeight;
    }

    function drawLogoFitted(cx, cy, maxW, maxH, bgCard = '#ffffff') {
      if (bgCard) {
        roundRect(cx - maxW / 2 - 8, cy - maxH / 2 - 8, maxW + 16, maxH + 16, 20, bgCard, '#38bdf844', 2);
      }
      if (!logoLoaded) {
        roundRect(cx - maxW / 2, cy - maxH / 2, maxW, maxH, 16, '#0f172a', '#22d3ee', 2);
        drawTextBlock('abbá MEND', cx, cy + 8, maxW - 12, 26, '800 20px system-ui', '#22d3ee', 'center');
        return;
      }
      const ratio = abbaLogo.naturalWidth / abbaLogo.naturalHeight || 1;
      let w = maxW;
      let h = w / ratio;
      if (h > maxH) {
        h = maxH;
        w = h * ratio;
      }
      ctx.drawImage(abbaLogo, cx - w / 2, cy - h / 2, w, h);
    }

    // Dibuja la APP de Menú Digital + Fidelización (marca ficticia ALBA & GRANO) dentro de un área (x, y, w, h)
    function drawInsideAppScreen(x, y, w, h, sec, mode = 'menu') {
      ctx.save();
      roundRect(x, y, w, h, 24, '#faf5ef');
      ctx.clip();

      // Barra superior de la app (estilo cálido editorial con marca ficticia ALBA & GRANO)
      const topH = Math.round(h * 0.12);
      roundRect(x, y, w, topH, 0, '#2c1810');

      const badgeR = Math.min(26, Math.round(topH * 0.34));
      ctx.beginPath();
      ctx.arc(x + 42, y + topH / 2, badgeR, 0, Math.PI * 2);
      ctx.fillStyle = '#f59e0b';
      ctx.fill();
      drawTextBlock('AG', x + 42, y + topH / 2 + 8, badgeR * 1.8, 24, '900 20px system-ui', '#2c1810', 'center');

      drawTextBlock('ALBA & GRANO', x + 80, y + topH / 2 - 2, w * 0.52, 26, '900 24px system-ui', '#ffffff', 'left');
      drawTextBlock('Menú Digital & Club', x + 80, y + topH / 2 + 22, w * 0.52, 20, '500 16px system-ui', '#fde68a', 'left');

      roundRect(x + w - 165, y + topH * 0.22, 142, topH * 0.56, 14, '#10b981');
      drawTextBlock(mode === 'menu' ? '● Carta' : '★ Club', x + w - 94, y + topH / 2 + 7, 130, 22, '800 18px system-ui', '#042316', 'center');

      const bodyY = y + topH + 16;
      const bodyH = h - topH - 28;

      if (mode === 'menu') {
        // Hero de la marca ficticia ALBA & GRANO dentro de la pantalla
        roundRect(x + 18, bodyY, w - 36, bodyH * 0.28, 18, '#f3e7d8', '#e2d0b9', 2);
        drawTextBlock('ALBA & GRANO • CAFÉ & DESAYUNOS', x + 36, bodyY + 34, w - 72, 22, '800 16px system-ui', '#7c2d12', 'left');
        drawTextBlock('Cada taza y cada bocado tienen su historia.', x + 36, bodyY + 72, w - 72, 34, '900 28px system-ui', '#1c1917', 'left');
        drawTextBlock('Pide en segundos • Sin comisiones • Suma puntos', x + 36, bodyY + bodyH * 0.28 - 18, w - 72, 22, '600 17px system-ui', '#57534e', 'left');

        // Ítems interactivos del menú que se van seleccionando
        const items = [
          { name: 'Combo Desayuno Alba', sub: 'Tigrillo + Café pasado', price: '$4.50', at: 4.8 },
          { name: 'Corviche Crocante (2u)', sub: 'Con salsa de maní', price: '$3.20', at: 6.2 },
          { name: 'Cold Brew & Empanada', sub: 'Ideal para media mañana', price: '$3.80', at: 7.6 }
        ];

        let total = 0;
        let selectedCount = 0;
        const listStartY = bodyY + bodyH * 0.31;
        const itemH = Math.min(112, (bodyH * 0.46) / 3);

        items.forEach((it, idx) => {
          const iy = listStartY + idx * (itemH + 12);
          const picked = sec >= it.at;
          if (picked) {
            total += parseFloat(it.price.replace('$', ''));
            selectedCount++;
          }

          roundRect(x + 18, iy, w - 36, itemH, 16, picked ? '#ecfdf5' : '#ffffff', picked ? '#10b981' : '#e5d8c8', 2.5);
          drawTextBlock(it.name, x + 34, iy + 36, w * 0.62, 26, '800 21px system-ui', '#1c1917', 'left');
          drawTextBlock(it.sub, x + 34, iy + 64, w * 0.62, 22, '500 17px system-ui', '#78716c', 'left');
          drawTextBlock(it.price, x + 34, iy + itemH - 14, 180, 24, '900 21px system-ui', '#047857', 'left');

          roundRect(x + w - 155, iy + itemH * 0.26, 118, itemH * 0.48, 12, picked ? '#10b981' : '#2c1810');
          drawTextBlock(picked ? '✓ Listo' : '+ Pedir', x + w - 96, iy + itemH * 0.56, 108, 22, '800 18px system-ui', picked ? '#042316' : '#ffffff', 'center');
        });

        // Barra inferior de pedido por WhatsApp dentro de la app
        const barY = y + h - 86;
        roundRect(x + 18, barY, w - 36, 68, 16, selectedCount > 0 ? '#15803d' : '#2c1810');
        drawTextBlock(
          `WhatsApp (${selectedCount}) • $${total.toFixed(2)}`,
          x + 34, barY + 42, w * 0.62, 24, '800 20px system-ui', '#ffffff', 'left'
        );
        drawTextBlock('Enviar →', x + w - 115, barY + 42, 95, 24, '900 20px system-ui', '#dcfce7', 'center');
      } else {
        // Vista de Fidelización dentro de la pantalla de la app
        const visits = Math.min(5, Math.floor((sec - 10.5) * 1.2) + 1);
        roundRect(x + 18, bodyY, w - 36, bodyH * 0.55, 20, '#2c1810');
        drawTextBlock('CLUB DE CLIENTES FRECUENTES', x + 36, bodyY + 38, w - 72, 24, '800 17px system-ui', '#fbbf24', 'left');
        drawTextBlock('ALBA & GRANO REWARDS', x + 36, bodyY + 74, w - 72, 32, '900 26px system-ui', '#ffffff', 'left');
        drawTextBlock(
          visits === 5 ? '¡5/5 SELLOS! Café + Empanada GRATIS' : `Progreso del cliente: ${visits} de 5 visitas`,
          x + 36, bodyY + 114, w - 72, 26, '700 20px system-ui', '#34d399', 'left'
        );

        const starY = bodyY + bodyH * 0.38;
        const gap = (w - 96) / 4;
        for (let i = 0; i < 5; i++) {
          const sx = x + 48 + i * gap;
          const active = i < visits;
          ctx.beginPath();
          ctx.arc(sx, starY, 26, 0, Math.PI * 2);
          ctx.fillStyle = active ? '#f59e0b' : '#44271b';
          ctx.fill();
          drawTextBlock(active ? '★' : `${i + 1}`, sx, starY + 8, 40, 24, '900 20px system-ui', active ? '#2c1810' : '#d6d3d1', 'center');
        }

        const rewardY = bodyY + bodyH * 0.6;
        roundRect(x + 18, rewardY, w - 36, bodyH * 0.36, 20, '#ffffff', '#e5d8c8', 2);
        drawTextBlock('FIDELIZACIÓN SIN PAPEL', x + 36, rewardY + 38, w - 72, 24, '800 17px system-ui', '#7c2d12', 'left');
        drawTextBlock('Clientes que vuelven solos a tu local', x + 36, rewardY + 74, w - 72, 32, '900 25px system-ui', '#1c1917', 'left');
        drawTextBlock('Puntos, premios y recompra automática.', x + 36, rewardY + 112, w - 72, 24, '500 18px system-ui', '#57534e', 'left');
      }

      ctx.restore();
    }

    // Robot en movimiento sosteniendo una TABLET con la app funcionando (inspirado en imagen 1, sin marca de agua)
    function drawRobotHoldingTablet(cx, cy, sec, scale = 1, appMode = 'menu') {
      const floatY = Math.sin(sec * 3.6) * 14;
      const tilt = Math.sin(sec * 2.1) * 0.035;
      const blink = (sec % 3.2) > 3.02;
      const lookX = Math.sin(sec * 2.4) * 5;

      ctx.save();
      ctx.translate(cx, cy + floatY);
      ctx.rotate(tilt);
      ctx.scale(scale, scale);

      // Aura inferior del robot
      const floorGlow = ctx.createRadialGradient(0, 395, 10, 0, 395, 220);
      floorGlow.addColorStop(0, 'rgba(6, 182, 212, 0.35)');
      floorGlow.addColorStop(1, 'rgba(6, 182, 212, 0)');
      ctx.fillStyle = floorGlow;
      ctx.beginPath();
      ctx.ellipse(0, 395, 220, 36, 0, 0, Math.PI * 2);
      ctx.fill();

      // Piernas articuladas del robot
      roundRect(-78, 175, 42, 130, 18, '#e2e8f0', '#94a3b8', 2.5);
      roundRect(36, 175, 42, 130, 18, '#e2e8f0', '#94a3b8', 2.5);
      // Articulaciones oscuras y botas
      roundRect(-72, 295, 30, 48, 10, '#1e293b');
      roundRect(42, 295, 30, 48, 10, '#1e293b');
      roundRect(-94, 332, 74, 58, 22, '#f8fafc', '#94a3b8', 3);
      roundRect(20, 332, 74, 58, 22, '#f8fafc', '#94a3b8', 3);

      // Torso blanco brillante con detalle cian de AbbaMend
      const bodyGrad = ctx.createLinearGradient(-115, -15, 115, 185);
      bodyGrad.addColorStop(0, '#ffffff');
      bodyGrad.addColorStop(1, '#cbd5e1');
      roundRect(-115, -15, 230, 200, 64, bodyGrad, '#94a3b8', 3);

      // Emblema en el pecho
      roundRect(-42, 42, 84, 56, 18, '#0f172a', '#22d3ee', 2.5);
      drawTextBlock('AM', 0, 79, 76, 30, '900 28px system-ui', '#22d3ee', 'center');

      // Cabeza del robot
      const headGrad = ctx.createLinearGradient(-72, -235, 72, -65);
      headGrad.addColorStop(0, '#ffffff');
      headGrad.addColorStop(1, '#cbd5e1');
      roundRect(-68, -235, 136, 155, 54, headGrad, '#94a3b8', 3);

      // Visor oscuro con ojos cian brillantes
      roundRect(-48, -195, 96, 62, 28, '#090d16', '#1e293b', 2);
      if (blink) {
        ctx.strokeStyle = '#22d3ee';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(-32 + lookX, -164);
        ctx.lineTo(-10 + lookX, -164);
        ctx.moveTo(10 + lookX, -164);
        ctx.lineTo(32 + lookX, -164);
        ctx.stroke();
      } else {
        ctx.fillStyle = '#22d3ee';
        ctx.beginPath();
        ctx.arc(-21 + lookX, -164, 13, 0, Math.PI * 2);
        ctx.arc(21 + lookX, -164, 13, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-18 + lookX, -168, 4.5, 0, Math.PI * 2);
        ctx.arc(24 + lookX, -168, 4.5, 0, Math.PI * 2);
        ctx.fill();
      }

      // Brazo izquierdo señalando aprobación ("✓")
      const wave = Math.sin(sec * 6.5) * 0.22;
      ctx.save();
      ctx.translate(-122, 25);
      ctx.rotate(-0.65 + wave);
      roundRect(-18, 0, 34, 95, 16, '#f8fafc', '#94a3b8', 2.5);
      ctx.fillStyle = '#10b981';
      ctx.beginPath();
      ctx.arc(0, 102, 18, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // TABLET sostenida al frente / derecha donde corre la app
      const tabX = -225;
      const tabY = -215;
      const tabW = 540;
      const tabH = 740;

      // Marco de la tablet
      roundRect(tabX, tabY, tabW, tabH, 42, '#0f172a', '#38bdf8', 5);
      // Cámara frontal y botón home sutil
      ctx.fillStyle = '#475569';
      ctx.beginPath();
      ctx.arc(tabX + tabW / 2, tabY + 22, 6, 0, Math.PI * 2);
      ctx.fill();

      // Pantalla interior activa de la app
      drawInsideAppScreen(tabX + 22, tabY + 44, tabW - 44, tabH - 84, sec, appMode);

      // Mano mecánica del robot sujetando el borde derecho de la tablet
      roundRect(tabX + tabW - 14, tabY + 220, 44, 140, 18, '#f1f5f9', '#94a3b8', 3);
      for (let f = 0; f < 3; f++) {
        roundRect(tabX + tabW - 22, tabY + 240 + f * 38, 22, 18, 8, '#0284c7');
      }

      ctx.restore();
    }

    function drawTopHeader(sec) {
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, 0, 1080, 10);
      const grad = ctx.createLinearGradient(0, 0, 1080, 0);
      grad.addColorStop(0, '#06b6d4');
      grad.addColorStop(1, '#10b981');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, (Math.min(sec * 1000, DURATION) / DURATION) * 1080, 10);

      roundRect(48, 28, 984, 112, 56, '#0f172a', '#1e293b', 2);
      drawLogoFitted(106, 84, 72, 72, '#ffffff');

      drawTextBlock('AbbaMend', 158, 77, 540, 32, '800 29px system-ui', '#ffffff', 'left');
      drawTextBlock('App Menú Digital • Fidelización • Software a Medida', 158, 109, 560, 24, '500 20px system-ui', '#38bdf8', 'left');

      roundRect(755, 52, 245, 64, 32, '#06b6d4');
      drawTextBlock('Demo en Vivo', 877, 92, 220, 28, '800 23px system-ui', '#04131a', 'center');
    }

    function renderFrame(elapsed) {
      const t = Math.min(elapsed, DURATION);
      const sec = t / 1000;

      // Botón clicable de WhatsApp visible en el cierre (21s a 25s)
      waBtn.style.display = sec >= 21 ? 'flex' : 'none';

      const bg = ctx.createLinearGradient(0, 0, 0, 1920);
      bg.addColorStop(0, '#050911');
      bg.addColorStop(0.5, '#0b1324');
      bg.addColorStop(1, '#060a13');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, 1080, 1920);

      drawTopHeader(sec);

      // Titular superior claro sobre la app en pantalla
      if (sec < 10.5) {
        drawTextBlock(
          'Mira cómo funciona la app en pantalla',
          540, 205, 960, 56, '900 46px system-ui', '#ffffff', 'center'
        );
        drawTextBlock(
          'Menú digital interactivo + pedido directo a WhatsApp (marca demo: Alba & Grano)',
          540, 260, 960, 36, '600 27px system-ui', '#22d3ee', 'center'
        );

        // Robot moviéndose y sosteniendo la pantalla con el menú digital en vivo
        drawRobotHoldingTablet(575, 760, sec, 1.05, 'menu');

        drawTextBlock(
          'Tu negocio vende mejor con una app así; fideliza tus clientes',
          540, 1480, 940, 62, '800 48px system-ui', '#ffffff', 'center'
        );
        drawTextBlock(
          'Sin comisiones por pedido • Actualiza precios y platos al instante',
          540, 1635, 920, 42, '600 31px system-ui', '#fbbf24', 'center'
        );
      }
      // 10.5s - 17s: Fidelización dentro de la pantalla que sostiene el robot
      else if (sec < 17) {
        drawTextBlock(
          'Fidelización activa dentro de la app',
          540, 205, 960, 56, '900 46px system-ui', '#ffffff', 'center'
        );
        drawTextBlock(
          'El robot muestra cómo el cliente suma visitas y desbloquea premios',
          540, 260, 960, 36, '600 27px system-ui', '#fbbf24', 'center'
        );

        drawRobotHoldingTablet(575, 760, sec, 1.05, 'loyalty');

        drawTextBlock(
          'Tu negocio vende mejor con una app así; fideliza tus clientes',
          540, 1480, 940, 62, '800 48px system-ui', '#ffffff', 'center'
        );
        drawTextBlock(
          'Convierte compras ocasionales en clientes recurrentes',
          540, 1635, 920, 42, '600 31px system-ui', '#34d399', 'center'
        );
      }
      // 17s - 25s: Ecosistema AbbaMend + Cierre con Logo + Robot + CTA WhatsApp
      else {
        drawTextBlock(
          'Automatización, apps y software a medida',
          540, 205, 960, 56, '900 44px system-ui', '#ffffff', 'center'
        );
        drawTextBlock(
          'Con el respaldo de AbbaMend Full-Stack AI Builder',
          540, 258, 960, 36, '700 28px system-ui', '#22d3ee', 'center'
        );

        drawLogoFitted(540, 395, 360, 180, '#ffffff');
        drawRobotHoldingTablet(575, 845, sec, 0.92, 'menu');

        drawTextBlock(
          'Tu negocio vende mejor con una app así; fideliza tus clientes',
          540, 1450, 940, 56, '800 42px system-ui', '#ffffff', 'center'
        );
      }
    }

    function playAnimation(onComplete) {
      cancelAnimationFrame(animId);
      startTime = performance.now();

      function loop(now) {
        const elapsed = now - startTime;
        renderFrame(elapsed);
        if (elapsed < DURATION) {
          animId = requestAnimationFrame(loop);
        } else if (onComplete) {
          onComplete();
        }
      }
      animId = requestAnimationFrame(loop);
    }

    document.getElementById('btnPlay').onclick = () => {
      statusEl.textContent = 'Reproduciendo vista previa (25s)...';
      playAnimation(() => { statusEl.textContent = 'Vista previa finalizada.'; });
    };

    document.getElementById('btnRecord').onclick = () => {
      const stream = canvas.captureStream(60);
      const recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
      const chunks = [];

      recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'abbamend-robot-app-menu-25s.webm';
        a.click();
        statusEl.textContent = '¡Video descargado! Listo para convertir a .mp4 o publicar.';
      };

      statusEl.textContent = 'Grabando 25 segundos en tiempo real... No cierres la pestaña.';
      recorder.start();
      playAnimation(() => recorder.stop());
    };

    // Inicia en el segundo 6 para ver al robot sosteniendo la pantalla con el menú activo
    renderFrame(6000);
  </script>
</body>
</html>
