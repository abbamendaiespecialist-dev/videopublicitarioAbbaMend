<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AbbaMend Promo Generator — Web App + Fidelización</title>
  <style>
    body {
      margin: 0;
      background: #090c10;
      color: #f8fafc;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 16px;
    }
    canvas {
      height: 75vh;
      aspect-ratio: 9 / 16;
      border-radius: 24px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.75);
      border: 1px solid #1e293b;
      background: #faf6f2;
    }
    .controls {
      display: flex;
      gap: 12px;
    }
    button {
      padding: 12px 22px;
      border-radius: 12px;
      border: none;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
      transition: transform 0.15s ease;
    }
    button:active { transform: scale(0.97); }
    #btnPlay { background: #1e293b; color: #f8fafc; }
    #btnRecord { background: #7c1d18; color: #ffffff; }
    #status { font-size: 13px; color: #94a3b8; }
  </style>
</head>
<body>

  <canvas id="stage" width="1080" height="1920"></canvas>

  <div class="controls">
    <button id="btnPlay">▶ Vista Previa (25s)</button>
    <button id="btnRecord">⏺ Grabar y Descargar (.webm)</button>
  </div>
  <div id="status">Sube logo-abbamend.png junto a index.html para usar tu logo real.</div>

  <script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');

    const DURATION = 25000;
    let startTime = null;
    let animId = null;

    // Cargar logo real de AbbaMend desde el mismo repositorio (o URL de Supabase Storage)
    const abbaLogo = new Image();
    abbaLogo.crossOrigin = 'anonymous';
    abbaLogo.src = './logo-abbamend.png';
    let logoLoaded = false;
    abbaLogo.onload = () => {
      logoLoaded = true;
      statusEl.textContent = 'Logo de AbbaMend cargado correctamente. Listo para grabar.';
      renderFrame(performance.now() - (startTime || performance.now()));
    };

    function roundRect(x, y, w, h, r, fill, stroke = null, lineWidth = 3) {
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, r);
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lineWidth; ctx.stroke(); }
    }

    function drawCenteredText(text, x, y, maxWidth, lineHeight, font, color) {
      ctx.font = font;
      ctx.fillStyle = color;
      ctx.textAlign = 'center';
      const words = text.split(' ');
      let line = '';
      const lines = [];

      for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        if (ctx.measureText(testLine).width > maxWidth && n > 0) {
          lines.push(line.trim());
          line = words[n] + ' ';
        } else {
          line = testLine;
        }
      }
      lines.push(line.trim());

      lines.forEach((l, idx) => {
        ctx.fillText(l, x, y + idx * lineHeight);
      });
    }

    function drawAbbaMendBrand(cx, cy, size = 120, withSubtitle = false) {
      ctx.save();
      if (logoLoaded) {
        ctx.drawImage(abbaLogo, cx - size / 2, cy - size / 2, size, size);
      } else {
        // Respaldo limpio si aún no se sube logo-abbamend.png
        roundRect(cx - size / 2, cy - size / 2, size, size, size * 0.24, '#111827', '#10b981', 3);
        drawCenteredText('AM', cx, cy + size * 0.14, size * 0.8, size * 0.4, `900 ${Math.round(size * 0.4)}px system-ui`, '#10b981');
      }

      if (withSubtitle) {
        drawCenteredText('AbbaMend', cx, cy + size / 2 + 64, 800, 70, '900 62px system-ui', '#111827');
        drawCenteredText('FULL-STACK AI BUILDER', cx, cy + size / 2 + 114, 800, 40, '700 28px system-ui', '#7c1d18');
      }
      ctx.restore();
    }

    function drawTopBar(sec) {
      // Barra de progreso superior
      ctx.fillStyle = '#e5ddd5';
      ctx.fillRect(0, 0, 1080, 10);
      ctx.fillStyle = '#7c1d18';
      ctx.fillRect(0, 0, (Math.min(sec * 1000, DURATION) / DURATION) * 1080, 10);

      // Header estilo web-app
      roundRect(48, 32, 984, 110, 55, '#ffffff', '#ebe3da', 2);
      drawAbbaMendBrand(106, 87, 68, false);

      ctx.textAlign = 'left';
      ctx.fillStyle = '#141414';
      ctx.font = '800 32px system-ui';
      ctx.fillText('AbbaMend', 154, 84);
      ctx.fillStyle = '#6b625b';
      ctx.font = '500 21px system-ui';
      ctx.fillText('Catálogos, Fidelización & Software a Medida', 154, 114);

      roundRect(750, 54, 250, 66, 33, '#7c1d18');
      drawCenteredText('Demo en Vivo', 875, 95, 220, 30, '700 24px system-ui', '#ffffff');
    }

    function renderFrame(elapsed) {
      const t = Math.min(elapsed, DURATION);
      const sec = t / 1000;

      // Fondo crema editorial claro inspirado en la referencia
      const bg = ctx.createLinearGradient(0, 0, 0, 1920);
      bg.addColorStop(0, '#fcf9f6');
      bg.addColorStop(1, '#f5efe8');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, 1080, 1920);

      drawTopBar(sec);

      // ==================================================
      // ESCENA 1 (0s - 4s): Gancho + Hero de Marca Ficticia (KINETIX)
      // ==================================================
      if (sec < 4) {
        roundRect(64, 190, 952, 1120, 48, '#f8f1ea', '#e8dfd5', 2);

        roundRect(110, 240, 640, 58, 29, '#ffffff', '#e4dad0', 2);
        drawCenteredText('KINETIX • SNEAKERS, STREETWEAR & DROPS', 430, 277, 600, 30, '700 22px system-ui', '#7c1d18');

        ctx.textAlign = 'left';
        ctx.fillStyle = '#111111';
        ctx.font = '900 82px system-ui';
        ctx.fillText('Cada paso marca', 110, 405);
        ctx.fillText('tu propio estilo.', 110, 495);

        ctx.fillStyle = '#57534e';
        ctx.font = '500 34px system-ui';
        ctx.fillText('Catálogo interactivo, club de puntos', 110, 585);
        ctx.fillText('y pedido directo por WhatsApp sin', 110, 630);
        ctx.fillText('depender de respuestas manuales.', 110, 675);

        // Tarjeta destacada de marca ficticia KINETIX
        roundRect(110, 740, 860, 380, 36, '#7c1d18');
        drawCenteredText('KINETIX', 540, 915, 760, 90, '900 92px system-ui', '#ffffff');
        drawCenteredText('URBAN FOOTWEAR & DROPS • MARCA DEMO', 540, 985, 760, 36, '700 26px system-ui', '#fecaca');
        drawCenteredText('Catálogo listo • Clientes frecuentes • Reserva WhatsApp', 540, 1045, 760, 36, '500 26px system-ui', '#fde8e8');

        // Botones de acción visual
        roundRect(110, 1165, 360, 84, 24, '#7c1d18');
        drawCenteredText('Ver catálogo  >', 290, 1216, 320, 36, '700 28px system-ui', '#ffffff');

        roundRect(495, 1165, 475, 84, 24, '#ffffff', '#dfd5ca', 2);
        drawCenteredText('Tienda & Drops • Atención rápida', 732, 1216, 440, 36, '600 25px system-ui', '#292524');

        drawCenteredText('¿Tu negocio vende mejor con una web así?', 540, 1465, 920, 72, '800 56px system-ui', '#111111');
        drawCenteredText('Menú o catálogo digital + fidelización en un solo flujo', 540, 1615, 900, 46, '500 34px system-ui', '#57534e');
      }

      // ==================================================
      // ESCENA 2 (4s - 10.5s): Catálogo / Menú Digital + Pedido WhatsApp
      // ==================================================
      else if (sec < 10.5) {
        const localT = sec - 4;
        ctx.textAlign = 'left';
        ctx.fillStyle = '#7c1d18';
        ctx.font = '800 26px system-ui';
        ctx.fillText('CATÁLOGO / MENÚ INTERACTIVO • KINETIX', 64, 215);

        ctx.fillStyle = '#111111';
        ctx.font = '900 56px system-ui';
        ctx.fillText('Eligen, suman y piden', 64, 282);
        ctx.fillText('directo a tu WhatsApp.', 64, 344);

        const products = [
          { tag: 'DROP 01', name: 'Runner Retro 98 Cream', sub: 'Tallas 38–43 • Envío inmediato', price: '$68.00', at: 0.7 },
          { tag: 'EDICIÓN', name: 'Court Low Obsidian', sub: 'Cuero sintético • Alta rotación', price: '$59.00', at: 2.0 },
          { tag: 'ACCESORIO', name: 'Pack 3 Medias Pro Crew', sub: 'Algodón peinado • Combina bien', price: '$14.00', at: 3.3 }
        ];

        let total = 0;
        let itemsCount = 0;

        products.forEach((p, idx) => {
          const y = 395 + idx * 315;
          const active = localT >= p.at;
          if (active) {
            total += parseFloat(p.price.replace('$', ''));
            itemsCount++;
          }

          roundRect(64, y, 952, 280, 36, active ? '#fff8f6' : '#ffffff', active ? '#7c1d18' : '#e6ddd3', active ? 3.5 : 2);

          ctx.textAlign = 'left';
          ctx.fillStyle = '#7c1d18';
          ctx.font = '800 22px system-ui';
          ctx.fillText(p.tag, 104, y + 56);

          ctx.fillStyle = '#111111';
          ctx.font = '800 38px system-ui';
          ctx.fillText(p.name, 104, y + 108);

          ctx.fillStyle = '#6b625b';
          ctx.font = '500 26px system-ui';
          ctx.fillText(p.sub, 104, y + 154);

          ctx.fillStyle = '#111111';
          ctx.font = '900 36px system-ui';
          ctx.fillText(p.price, 104, y + 232);

          roundRect(740, y + 178, 235, 68, 20, active ? '#7c1d18' : '#f3ece4', active ? '#7c1d18' : '#d6cbc0', 2);
          drawCenteredText(active ? '✓ Agregado' : '+ Seleccionar', 857, y + 221, 210, 30, '700 25px system-ui', active ? '#ffffff' : '#292524');
        });

        // Barra inferior de reserva rápida por WhatsApp
        const ready = localT >= 4.3;
        roundRect(64, 1365, 952, 165, 38, ready ? '#15803d' : '#ffffff', ready ? '#15803d' : '#dfd5ca', 3);

        ctx.textAlign = 'left';
        ctx.fillStyle = ready ? '#ffffff' : '#111111';
        ctx.font = '800 32px system-ui';
        ctx.fillText(`Reserva rápida por WhatsApp (${itemsCount} ítems)`, 104, 1432);

        ctx.fillStyle = ready ? '#dcfce7' : '#6b625b';
        ctx.font = '600 26px system-ui';
        ctx.fillText(`Se arma en vivo con lo elegido • Total: $${total.toFixed(2)}`, 104, 1482);

        drawCenteredText('Sin comisiones de terceros • Ideal para menús o catálogos', 540, 1640, 920, 44, '700 32px system-ui', '#292524');
      }

      // ==================================================
      // ESCENA 3 (10.5s - 16.5s): Club de Clientes Frecuentes
      // ==================================================
      else if (sec < 16.5) {
        const localT = sec - 10.5;

        // Tarjeta oscura superior estilo la captura ("Club de Clientes Frecuentes")
        roundRect(64, 210, 952, 540, 44, '#5e1410');

        ctx.textAlign = 'left';
        ctx.fillStyle = '#fca5a5';
        ctx.font = '800 24px system-ui';
        ctx.fillText('BENEFICIOS PARA TI', 110, 282);

        roundRect(690, 240, 276, 62, 31, '#7c1d18', '#a83832', 2);
        const visits = Math.min(5, Math.floor(localT * 1.2) + 1);
        drawCenteredText(visits === 5 ? 'NIVEL VIP • PREMIO' : `CLIENTE • ${visits} VISITAS`, 828, 280, 250, 30, '800 22px system-ui', '#ffffff');

        ctx.fillStyle = '#ffffff';
        ctx.font = '900 50px system-ui';
        ctx.fillText('Club de Clientes Frecuentes', 110, 365);
        ctx.fillStyle = '#fed7aa';
        ctx.font = '700 36px system-ui';
        ctx.fillText('• KINETIX', 110, 418);

        // 5 Sellos de fidelización
        for (let i = 0; i < 5; i++) {
          const cx = 175 + i * 182;
          const cy = 585;
          const earned = i < visits;

          ctx.beginPath();
          ctx.arc(cx, cy, 62, 0, Math.PI * 2);
          ctx.fillStyle = earned ? '#ffffff' : '#430d0a';
          ctx.fill();
          ctx.lineWidth = 3;
          ctx.strokeStyle = earned ? '#ffffff' : '#99342e';
          ctx.stroke();

          drawCenteredText(earned ? '★' : `#${i + 1}`, cx, cy + 16, 90, 40, '900 40px system-ui', earned ? '#5e1410' : '#fca5a5');
        }

        // Tarjeta clara inferior con el beneficio activo
        roundRect(64, 795, 952, 470, 44, '#ffffff', '#e6ddd3', 2);
        ctx.textAlign = 'left';
        ctx.fillStyle = '#7c1d18';
        ctx.font = '800 26px system-ui';
        ctx.fillText('FIDELIZACIÓN DIGITAL ACTIVA', 110, 868);

        ctx.fillStyle = '#111111';
        ctx.font = '900 48px system-ui';
        ctx.fillText(visits === 5 ? '¡Beneficio VIP desbloqueado!' : 'Suma visitas y desbloquea', 110, 935);
        ctx.fillText(visits === 5 ? '15% OFF en tu próximo pedido' : 'beneficios exclusivos.', 110, 995);

        ctx.fillStyle = '#57534e';
        ctx.font = '500 30px system-ui';
        ctx.fillText('Historial de compras, puntos o sellos sin papel', 110, 1075);
        ctx.fillText('y listo para activar recurrencia en tu negocio.', 110, 1118);

        roundRect(110, 1165, 420, 64, 20, '#f8f1ea');
        drawCenteredText('✓ Sin tarjetas físicas', 320, 1205, 380, 30, '700 24px system-ui', '#111111');

        roundRect(555, 1165, 410, 64, 20, '#f8f1ea');
        drawCenteredText('✓ Clientes que vuelven', 760, 1205, 380, 30, '700 24px system-ui', '#111111');

        drawCenteredText('Convierte compras sueltas en clientes recurrentes', 540, 1435, 920, 72, '800 56px system-ui', '#111111');
      }

      // ==================================================
      // ESCENA 4 (16.5s - 21s): Todo lo que hace AbbaMend
      // ==================================================
      else if (sec < 21) {
        ctx.textAlign = 'left';
        ctx.fillStyle = '#7c1d18';
        ctx.font = '800 26px system-ui';
        ctx.fillText('MÁS ALLÁ DEL CATÁLOGO Y LA FIDELIZACIÓN', 64, 215);

        ctx.fillStyle = '#111111';
        ctx.font = '900 56px system-ui';
        ctx.fillText('Automatización y software', 64, 282);
        ctx.fillText('a medida para crecer.', 64, 344);

        const capabilities = [
          { title: 'Automatización & Flujos Inteligentes', desc: 'Atención automatizada, captura de clientes y procesos conectados.' },
          { title: 'Web Apps & Micro-SaaS', desc: 'Tiendas, menús digitales, paneles de control y portales a medida.' },
          { title: 'Sistemas & Datos a Medida', desc: 'Soluciones construidas según la operación real de tu empresa.' }
        ];

        capabilities.forEach((cap, idx) => {
          const y = 415 + idx * 335;
          roundRect(64, y, 952, 290, 36, '#ffffff', '#e4dad0', 2);

          roundRect(104, y + 48, 86, 86, 24, '#7c1d18');
          drawCenteredText(`0${idx + 1}`, 147, y + 104, 80, 40, '900 34px system-ui', '#ffffff');

          ctx.textAlign = 'left';
          ctx.fillStyle = '#111111';
          ctx.font = '800 38px system-ui';
          ctx.fillText(cap.title, 220, y + 98);

          ctx.fillStyle = '#57534e';
          ctx.font = '500 30px system-ui';
          const mid = Math.ceil(cap.desc.split(' ').length / 2);
          const words = cap.desc.split(' ');
          ctx.fillText(words.slice(0, mid).join(' '), 220, y + 162);
          ctx.fillText(words.slice(mid).join(' '), 220, y + 204);
        });

        drawCenteredText('De una solución rápida a un sistema completo', 540, 1520, 920, 56, '800 44px system-ui', '#7c1d18');
      }

      // ==================================================
      // ESCENA 5 (21s - 25s): Cierre con Logo Real de AbbaMend
      // ==================================================
      else {
        roundRect(64, 250, 952, 1340, 52, '#ffffff', '#e6ddd3', 2);

        drawAbbaMendBrand(540, 540, 210, true);

        drawCenteredText('Menús y catálogos digitales • Fidelización • Automatización • Software a medida', 540, 885, 820, 46, '600 32px system-ui', '#44403c');

        roundRect(130, 1025, 820, 190, 32, '#f8f1ea');
        drawCenteredText('¿Quieres una demo para tu negocio?', 540, 1098, 760, 44, '800 36px system-ui', '#111111');
        drawCenteredText('Escríbenos y adaptamos la solución a tu operación', 540, 1158, 760, 40, '500 30px system-ui', '#57534e');

        const pulse = 1 + Math.sin(sec * 10) * 0.025;
        ctx.save();
        ctx.translate(540, 1350);
        ctx.scale(pulse, pulse);
        roundRect(-370, -68, 740, 136, 68, '#7c1d18');
        drawCenteredText('Solicitar Demo por WhatsApp  →', 0, 14, 700, 40, '800 36px system-ui', '#ffffff');
        ctx.restore();
      }
    }

    function playAnimation(onComplete) {
      cancelAnimationFrame(animId);
      startTime = performance.now();

      function loop(now) {
        const elapsed = now - startTime;
        renderFrame(elapsed);
        if (elapsed < DURATION) {
          animId = requestAnimationFrame(loop);
        } else if (onComplete) {
          onComplete();
        }
      }
      animId = requestAnimationFrame(loop);
    }

    document.getElementById('btnPlay').onclick = () => {
      statusEl.textContent = 'Reproduciendo vista previa (25s)...';
      playAnimation(() => { statusEl.textContent = 'Vista previa finalizada.'; });
    };

    document.getElementById('btnRecord').onclick = () => {
      const stream = canvas.captureStream(60);
      const recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
      const chunks = [];

      recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'abbamend-demo-kinetix-25s.webm';
        a.click();
        statusEl.textContent = '¡Video descargado! Listo para subir a Supabase Storage o redes.';
      };

      statusEl.textContent = 'Grabando 25 segundos en tiempo real... No cierres la pestaña.';
      recorder.start();
      playAnimation(() => recorder.stop());
    };

    renderFrame(1500);
  </script>
</body>
</html>
